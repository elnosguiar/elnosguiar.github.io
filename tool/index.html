<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>평면도 400장 ZIP 압축 다운로드</title>
    <!-- 필수 라이브러리 로드 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        :root {
            --wall-color: #333;
            --floor-color: #f0f0f0;
            --room-color: #e3f2fd;
            --entrance-color: #ffcc80;
            --text-color: #555;
        }

        body {
            font-family: 'Malgun Gothic', sans-serif;
            background-color: #fafafa;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        /* 다운로드할 도면 영역 (화면 밖으로 숨김 처리) */
        #floorplan-container {
            position: absolute;
            left: -10000px;
            top: -10000px;
            width: 800px;
            height: 600px;
            background-color: var(--floor-color);
            border: 4px solid var(--wall-color);
            overflow: hidden;
            display: block;
        }

        .room {
            position: absolute;
            background-color: var(--room-color);
            border: 2px solid var(--wall-color);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: bold;
            color: var(--text-color);
            box-sizing: border-box;
        }

        .room.entrance {
            background-color: var(--entrance-color);
        }

        /* 상태 박스 및 버튼 */
        #status-box {
            margin-top: 20px;
            padding: 20px;
            background-color: white;
            border-radius: 8px;
            border: 1px solid #ddd;
            text-align: center;
            width: 80%;
            max-width: 400px;
        }

        #start-btn {
            margin-top: 15px;
            padding: 10px 20px;
            font-size: 16px;
            background-color: #333;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        #start-btn:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }

        /* 로딩 애니메이션 */
        .loader {
            border: 5px solid #f3f3f3;
            border-top: 5px solid #333;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            display: none;
            margin: 10px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

    </style>
</head>
<body>

    <h1>평면도 400장 ZIP 압축 다운로드</h1>
    <p>가구 없는 골조 도면 400장을 생성하여 하나의 ZIP 파일로 압축합니다.</p>

    <div id="status-box">
        <div id="status-text">아래 버튼을 누르면 시작합니다.</div>
        <div class="loader" id="loader"></div>
        <div id="progress-text"></div>
        <button id="start-btn">400장 생성 및 압축 다운로드 시작</button>
    </div>

    <!-- JavaScript로 도면이 생성되는 숨겨진 영역 -->
    <div id="floorplan-container"></div>

    <script>
        const container = document.getElementById('floorplan-container');
        const startBtn = document.getElementById('start-btn');
        const statusText = document.getElementById('status-text');
        const progressText = document.getElementById('progress-text');
        const loader = document.getElementById('loader');
        const totalImages = 400; // 총 개수

        // 방 목록
        const roomTypes = [
            { name: '현관', class: 'entrance' },
            { name: '로비', class: 'lobby' },
            { name: '사무실 A', class: 'office' },
            { name: '사무실 B', class: 'office' },
            { name: '회의실', class: 'meeting' },
            { name: '창고', class: 'storage' },
            { name: '계단실', class: 'stairs' },
            { name: '엘리베이터', class: 'elevator' }
        ];

        // 겹침 확인
        function isOverlapping(newRoom, existingRooms) {
            for (let room of existingRooms) {
                if (!(newRoom.x + newRoom.width < room.x ||
                      newRoom.x > room.x + room.width ||
                      newRoom.y + newRoom.height < room.y ||
                      newRoom.y > room.y + room.height)) {
                    return true;
                }
            }
            return false;
        }

        // 도면 생성
        function generateRandomFloorPlan() {
            container.innerHTML = '';
            const placedRooms = [];

            roomTypes.forEach(type => {
                let room = {};
                let attempts = 0;
                let placed = false;

                while (!placed && attempts < 100) {
                    const width = Math.floor(Math.random() * (250 - 100)) + 100;
                    const height = Math.floor(Math.random() * (250 - 100)) + 100;
                    
                    if (type.class === 'entrance') {
                        const edge = Math.floor(Math.random() * 4);
                        if (edge === 0 || edge === 2) {
                            room.x = Math.floor(Math.random() * (800 - width));
                            room.y = (edge === 0) ? 0 : 600 - height;
                        } else {
                            room.x = (edge === 1) ? 800 - width : 0;
                            room.y = Math.floor(Math.random() * (600 - height));
                        }
                    } else {
                        room.x = Math.floor(Math.random() * (800 - width));
                        room.y = Math.floor(Math.random() * (600 - height));
                    }

                    room.width = width;
                    room.height = height;

                    if (!isOverlapping(room, placedRooms)) {
                        const roomEl = document.createElement('div');
                        roomEl.className = `room ${type.class}`;
                        roomEl.style.width = `${room.width}px`;
                        roomEl.style.height = `${room.height}px`;
                        roomEl.style.left = `${room.x}px`;
                        roomEl.style.top = `${room.y}px`;
                        roomEl.innerHTML = `<span>${type.name}</span>`;
                        container.appendChild(roomEl);
                        placedRooms.push(room);
                        placed = true;
                    }
                    attempts++;
                }
            });
        }

        // 메인 로직: 생성 -> 압축 -> 다운로드
        startBtn.addEventListener('click', async () => {
            startBtn.disabled = true;
            loader.style.display = 'block';
            statusText.innerText = '이미지를 생성하고 있습니다...';
            
            const zip = new JSZip(); // JSZip 객체 생성
            const imgFolder = zip.folder("floorplans"); // zip 내부 폴더 생성

            for (let i = 1; i <= totalImages; i++) {
                // 1. 도면 생성
                generateRandomFloorPlan();
                progressText.innerText = `생성 중: ${i} / ${totalImages}`;
                
                // 2. HTML을 캔버스로 변환 (html2canvas)
                // 중요: 렌더링 시간을 주기 위해 비동기 처리
                const canvas = await html2canvas(container, {
                    logging: false,
                    width: 800,
                    height: 600
                });
                
                // 3. 캔버스 데이터를 Base64 PNG로 변환
                const imgData = canvas.toDataURL('image/png').split(',')[1];
                
                // 4. ZIP 폴더에 이미지 파일 추가
                imgFolder.file(`floorplan_${i}.png`, imgData, {base64: true});

                // 브라우저 멈춤 방지를 위한 약간의 대기
                if (i % 20 === 0) {
                    await new Promise(resolve => setTimeout(resolve, 10));
                }
            }

            // 5. 압축 및 다운로드
            statusText.innerText = 'ZIP 파일로 압축하고 있습니다... (시간 소요)';
            progressText.innerText = '';

            // 압축 생성 (비동기)
            zip.generateAsync({type:"blob"}).then(function(content) {
                statusText.innerText = '압축 완료! 다운로드를 시작합니다.';
                loader.style.display = 'none';

                // 다운로드 링크 생성 및 클릭
                const link = document.createElement('a');
                link.href = URL.createObjectURL(content);
                link.download = "floorplans_400.zip"; // 저장될 파일명
                link.click();
                
                startBtn.disabled = false;
            });
        });

    </script>
</body>
</html>
