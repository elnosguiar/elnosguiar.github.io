<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>다양한 구조의 CAD 평면도 생성기 (100장)</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        body {
            font-family: 'Pretendard', -apple-system, sans-serif;
            background-color: #eef2f6;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            color: #222;
            margin: 0;
        }

        .controls {
            background: #ffffff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 800px;
            text-align: center;
            margin-bottom: 20px;
            box-sizing: border-box;
        }

        .btn {
            background: #0f172a;
            color: #ffffff;
            border: none;
            padding: 14px 28px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 10px;
        }
        .btn:disabled { background: #94a3b8; cursor: not-allowed; }

        .progress-box { margin-top: 15px; display: none; }
        .progress-bar-bg { width: 100%; height: 8px; background: #e2e8f0; border-radius: 4px; overflow: hidden; margin-bottom: 8px; }
        .progress-bar { width: 0%; height: 100%; background: #2563eb; transition: width 0.1s; }
        .status-text { font-size: 14px; font-weight: 600; color: #2563eb; }

        .preview-wrapper {
            width: 100%;
            max-width: 800px;
            background: #fff;
            border: 2px solid #cbd5e1;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            position: relative;
            box-sizing: border-box;
            border-radius: 4px;
            overflow: hidden;
        }
        
        .preview-title {
            background: #f1f5f9;
            padding: 10px;
            font-size: 14px;
            font-weight: bold;
            color: #475569;
            border-bottom: 1px solid #cbd5e1;
            text-align: center;
        }

        #preview-box { width: 100%; height: auto; display: block; }

        #render-target {
            position: absolute;
            left: -9999px;
            top: -9999px;
            width: 800px;
            height: 600px;
            background-color: #ffffff;
        }
    </style>
</head>
<body>

    <div class="controls">
        <h2 style="margin: 0 0 10px 0;">🎲 무작위 다양한 구조 CAD 평면도 (100장)</h2>
        <p style="margin: 0 0 15px 0; font-size: 14px; color: #64748b;">방 개수(3~12개), 복도 형태, 공간 크기가 매번 완전히 다르게 생성됩니다.</p>
        <button id="start-btn" class="btn">🚀 100장 생성 및 ZIP 다운로드</button>
        
        <div class="progress-box" id="p-box">
            <div class="progress-bar-bg"><div class="progress-bar" id="p-bar"></div></div>
            <div class="status-text" id="status-text">준비 중...</div>
        </div>
    </div>

    <div class="preview-wrapper">
        <div class="preview-title">🔴 실시간 무작위 생성 미리보기</div>
        <div id="preview-box"></div>
    </div>

    <div id="render-target"></div>

    <script>
        const previewBox = document.getElementById('preview-box');
        const renderTarget = document.getElementById('render-target');
        const startBtn = document.getElementById('start-btn');
        const pBox = document.getElementById('p-box');
        const pBar = document.getElementById('p-bar');
        const statusText = document.getElementById('status-text');
        const TOTAL = 100;

        // 완전 무작위 구획 기반 CAD SVG 생성기
        function createDiverseCadPlan(index) {
            const width = 800;
            const height = 600;
            const t = 6;  // 외벽
            const it = 3; // 내벽

            let svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${width} ${height}" width="100%" height="100%" style="background:#ffffff; font-family: sans-serif;">`;
            
            // 모눈종이 격자
            svg += `<defs><pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M 20 0 L 0 0 0 20" fill="none" stroke="#f1f5f9" stroke-width="1"/></pattern></defs>`;
            svg += `<rect width="100%" height="100%" fill="url(#grid)" />`;

            // 외곽 테두리
            svg += `<rect x="20" y="20" width="${width-40}" height="${height-40}" fill="none" stroke="#000" stroke-width="${t}"/>`;

            // --- 1. 무작위 그리드 시스템 (가로/세로 분할 수 다변화) ---
            const gridCols = Math.floor(Math.random() * 3) + 2; // 2 ~ 4열
            const gridRows = Math.floor(Math.random() * 3) + 2; // 2 ~ 4행
            
            // 컬럼 및 로우 크기를 무작위 비율로 나눔
            let colWidths = [];
            let rowHeights = [];
            
            let totalW = width - 40;
            for(let i=0; i<gridCols; i++) {
                if(i === gridCols - 1) colWidths.push(totalW);
                else {
                    let w = Math.floor((Math.random() * 0.3 + 0.15) * (width - 40));
                    colWidths.push(w);
                    totalW -= w;
                }
            }

            let totalH = height - 40;
            for(let i=0; i<gridRows; i++) {
                if(i === gridRows - 1) rowHeights.push(totalH);
                else {
                    let h = Math.floor((Math.random() * 0.3 + 0.15) * (height - 40));
                    rowHeights.push(h);
                    totalH -= h;
                }
            }

            // 공간 타입 타일 배치 (무작위)
            let totalCells = gridCols * gridRows;
            let roomTypes = ['EV', 'STAIRS', 'CORRIDOR'];
            // 나머지는 일반 방으로 채움
            while(roomTypes.length < totalCells) {
                const types = ['OFFICE', 'MEETING', 'STORAGE', 'CORRIDOR', 'OFFICE'];
                roomTypes.push(types[Math.floor(Math.random() * types.length)]);
            }
            // 배열 섞기
            for (let i = roomTypes.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [roomTypes[i], roomTypes[j]] = [roomTypes[j], roomTypes[i]];
            }

            // --- 2. 공간 그려넣기 ---
            let currY = 20;
            let typeIdx = 0;

            for(let r=0; r<gridRows; r++) {
                let currX = 20;
                let h = rowHeights[r];

                for(let c=0; c<gridCols; c++) {
                    let w = colWidths[c];
                    let type = roomTypes[typeIdx++];

                    if(type === 'CORRIDOR') {
                        // 복도 영역
                        svg += `<rect x="${currX}" y="${currY}" width="${w}" height="${h}" fill="#f8fafc"/>`;
                        svg += `<text x="${currX + w/2}" y="${currY + h/2 + 4}" font-size="12" font-weight="bold" fill="#cbd5e1" text-anchor="middle">CORRIDOR</text>`;
                    } else {
                        // 일반 방/계단/엘리베이터 벽체
                        svg += `<rect x="${currX}" y="${currY}" width="${w}" height="${h}" fill="none" stroke="#000" stroke-width="${it}"/>`;
                        
                        // 기둥
                        const cs = 8;
                        svg += `<rect x="${currX-cs/2}" y="${currY-cs/2}" width="${cs}" height="${cs}" fill="#000"/>`;
                        svg += `<rect x="${currX+w-cs/2}" y="${currY-cs/2}" width="${cs}" height="${cs}" fill="#000"/>`;
                        svg += `<rect x="${currX-cs/2}" y="${currY+h-cs/2}" width="${cs}" height="${cs}" fill="#000"/>`;
                        svg += `<rect x="${currX+w-cs/2}" y="${currY+h-cs/2}" width="${cs}" height="${cs}" fill="#000"/>`;

                        if(type === 'EV') {
                            // 엘리베이터 디테일
                            const mx = currX + 10, my = currY + 10, mw = w - 20, mh = h - 20;
                            if(mw > 20 && mh > 20) {
                                svg += `<rect x="${mx}" y="${my}" width="${mw}" height="${mh}" fill="#e2e8f0" stroke="#000" stroke-width="2"/>`;
                                svg += `<line x1="${mx}" y1="${my}" x2="${mx+mw}" y2="${my+mh}" stroke="#94a3b8" stroke-dasharray="3,3"/>`;
                                svg += `<line x1="${mx+mw}" y1="${my}" x2="${mx}" y2="${my+mh}" stroke="#94a3b8" stroke-dasharray="3,3"/>`;
                                svg += `<text x="${currX + w/2}" y="${currY + h/2 + 5}" font-size="14" font-weight="bold" text-anchor="middle" fill="#334155">E/V</text>`;
                            }
                        } else if(type === 'STAIRS') {
                            // 계단실 디테일
                            const mx = currX + 10, my = currY + 10, mw = w - 20, mh = h - 20;
                            if(mw > 20 && mh > 20) {
                                svg += `<rect x="${mx}" y="${my}" width="${mw}" height="${mh}" fill="#f1f5f9" stroke="#000" stroke-width="1.5"/>`;
                                const steps = 6;
                                const stepH = mh / steps;
                                for(let s=1; s<steps; s++) {
                                    svg += `<line x1="${mx}" y1="${my + s*stepH}" x2="${mx+mw}" y2="${my + s*stepH}" stroke="#94a3b8"/>`;
                                }
                                svg += `<line x1="${mx + mw/2}" y1="${my}" x2="${mx + mw/2}" y2="${my+mh}" stroke="#000"/>`;
                                svg += `<text x="${currX + w/2}" y="${currY + h/2 + 4}" font-size="12" font-weight="bold" fill="#334155" text-anchor="middle">STAIRS</text>`;
                            }
                        } else {
                            // 방 텍스트 및 치수
                            const roomName = type === 'MEETING' ? 'MEETING' : (type === 'STORAGE' ? 'STORAGE' : 'OFFICE');
                            if(w > 50 && h > 40) {
                                svg += `<text x="${currX + w/2}" y="${currY + h/2 - 4}" font-size="13" font-weight="bold" fill="#1e293b" text-anchor="middle">${roomName}</text>`;
                                svg += `<text x="${currX + w/2}" y="${currY + h/2 + 12}" font-size="10" fill="#64748b" text-anchor="middle">${Math.floor(w*10)}×${Math.floor(h*10)}</text>`;
                            }

                            // 문 달기 (방 변 중 무작위 1곳)
                            if(w > 40 && h > 40) {
                                const doorSize = Math.min(30, w - 10);
                                const dx = currX + (w - doorSize)/2;
                                const dy = currY + h;
                                svg += `<rect x="${dx}" y="${dy - it}" width="${doorSize}" height="${it*2}" fill="#ffffff"/>`;
                                svg += `<line x1="${dx}" y1="${dy}" x2="${dx}" y2="${dy - doorSize}" stroke="#ef4444" stroke-width="2"/>`;
                                svg += `<path d="M ${dx} ${dy - doorSize} A ${doorSize} ${doorSize} 0 0 1 ${dx + doorSize} ${dy}" fill="none" stroke="#ef4444" stroke-width="1" stroke-dasharray="3,2"/>`;
                            }
                        }
                    }

                    currX += w;
                }
                currY += h;
            }

            // 도면 타이틀 표기
            svg += `<rect x="20" y="20" width="220" height="28" fill="#000"/>`;
            svg += `<text x="30" y="39" font-size="12" font-weight="bold" fill="#fff">LAYOUT NO.${String(index).padStart(3, '0')} (${gridCols}x${gridRows} GRID)</text>`;

            svg += `</svg>`;
            return svg;
        }

        // 다운로드 프로세스
        startBtn.addEventListener('click', async () => {
            startBtn.disabled = true;
            pBox.style.display = 'block';
            statusText.innerText = '무작위 도면 렌더링 중...';

            const zip = new JSZip();
            const folder = zip.folder("Diverse_CAD_Floorplans");

            for(let i = 1; i <= TOTAL; i++) {
                const svgContent = createDiverseCadPlan(i);
                
                previewBox.innerHTML = svgContent;
                renderTarget.innerHTML = svgContent;

                const canvas = await html2canvas(renderTarget, { logging: false, scale: 2 });
                const imgData = canvas.toDataURL('image/png').split(',')[1];
                
                folder.file(`Random_Floorplan_${String(i).padStart(3, '0')}.png`, imgData, {base64: true});

                pBar.style.width = Math.round((i / TOTAL) * 100) + '%';
                statusText.innerText = `생성 중... ${i} / ${TOTAL} 완료`;

                await new Promise(r => setTimeout(r, 40)); 
            }

            statusText.innerText = 'ZIP 압축 패키징 중...';
            
            zip.generateAsync({type:"blob"}).then(content => {
                const link = document.createElement('a');
                link.href = URL.createObjectURL(content);
                link.download = "Diverse_Floorplans_100.zip";
                link.click();

                statusText.innerText = '✅ 다양성을 갖춘 100장 다운로드 완료!';
                startBtn.disabled = false;
                startBtn.innerText = "다시 생성하기";
            });
        });
        
        // 초기 샘플 출력
        previewBox.innerHTML = createDiverseCadPlan('RND');
    </script>
</body>
</html>
