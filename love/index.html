<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HEART OF BLUE</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');

:root{
    --cyan:#8ff6ff;
    --sky:#38dfff;
    --blue:#008cff;
    --deep:#0050ff;
    --bg:#010817;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:var(--bg);
}

body{
    font-family:Inter,sans-serif;
    color:white;
    cursor:none;
}

canvas{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
}

/* -----------------------------
   ATMOSPHERE
----------------------------- */

#stars{
    z-index:0;
}

#aurora{
    z-index:1;
    mix-blend-mode:screen;
}

#particles{
    z-index:2;
}

#heartCanvas{
    z-index:3;
}

.vignette{
    position:fixed;
    inset:0;
    z-index:4;
    pointer-events:none;

    background:
        radial-gradient(
            ellipse at center,
            transparent 25%,
            rgba(0,5,20,.18) 55%,
            rgba(0,3,12,.88) 100%
        );
}

/* -----------------------------
   UI
----------------------------- */

.ui{
    position:fixed;
    inset:0;
    z-index:10;
    pointer-events:none;
}

.top{
    position:absolute;
    top:42px;
    left:50%;
    transform:translateX(-50%);
    text-align:center;
}

.eyebrow{
    font-size:10px;
    letter-spacing:.65em;
    color:rgba(180,245,255,.55);
    margin-left:.65em;
    text-transform:uppercase;
}

.title{
    margin-top:16px;
    font-size:clamp(34px,6vw,76px);
    font-weight:800;
    letter-spacing:-.07em;
    line-height:.9;

    background:
        linear-gradient(
            100deg,
            #fff,
            #a8f8ff 25%,
            #27cfff 50%,
            #fff 75%,
            #8fefff
        );

    background-size:300% 100%;
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;

    animation:titleFlow 8s linear infinite;

    filter:
        drop-shadow(0 0 12px rgba(62,220,255,.5));
}

@keyframes titleFlow{
    to{
        background-position:300% 0;
    }
}

.bottom{
    position:absolute;
    bottom:35px;
    left:50%;
    transform:translateX(-50%);
    text-align:center;

    font-size:9px;
    letter-spacing:.45em;
    color:rgba(170,235,255,.42);
    white-space:nowrap;
}

.hint{
    position:absolute;
    bottom:35px;
    right:40px;

    font-size:9px;
    letter-spacing:.2em;
    color:rgba(170,235,255,.3);
}

/* -----------------------------
   CENTER HEART
----------------------------- */

.core{
    position:absolute;
    left:50%;
    top:50%;
    width:300px;
    height:300px;
    transform:translate(-50%,-50%);
}

.core::before,
.core::after{
    content:"";
    position:absolute;
    inset:20px;
    border-radius:50%;
    border:1px solid rgba(108,228,255,.12);
    box-shadow:
        0 0 60px rgba(0,170,255,.08),
        inset 0 0 60px rgba(0,170,255,.05);
}

.core::after{
    inset:-15px;
    border-color:rgba(62,208,255,.07);
    animation:ring 8s linear infinite;
}

@keyframes ring{
    to{
        transform:rotate(360deg);
    }
}

.mainHeart{
    position:absolute;
    left:50%;
    top:50%;

    transform:
        translate(-50%,-50%)
        rotate(-45deg);

    width:94px;
    height:94px;

    background:
        linear-gradient(
            135deg,
            #dfffff,
            #64eaff 30%,
            #009dff 65%,
            #0057ff
        );

    filter:
        drop-shadow(0 0 8px #a5f8ff)
        drop-shadow(0 0 25px #25d8ff)
        drop-shadow(0 0 60px #007cff)
        drop-shadow(0 0 110px rgba(0,119,255,.7));

    animation:
        beat 2s cubic-bezier(.65,0,.35,1) infinite;

    z-index:2;
}

.mainHeart::before,
.mainHeart::after{
    content:"";
    position:absolute;
    width:94px;
    height:94px;
    border-radius:50%;
    background:inherit;
}

.mainHeart::before{
    top:-47px;
    left:0;
}

.mainHeart::after{
    left:47px;
    top:0;
}

@keyframes beat{
    0%,100%{
        transform:
            translate(-50%,-50%)
            rotate(-45deg)
            scale(.9);
    }

    12%{
        transform:
            translate(-50%,-50%)
            rotate(-45deg)
            scale(1.04);
    }

    22%{
        transform:
            translate(-50%,-50%)
            rotate(-45deg)
            scale(.94);
    }

    32%{
        transform:
            translate(-50%,-50%)
            rotate(-45deg)
            scale(1);
    }
}

/* -----------------------------
   CUSTOM CURSOR
----------------------------- */

.cursor{
    position:fixed;
    width:7px;
    height:7px;
    border-radius:50%;
    background:#fff;
    box-shadow:
        0 0 8px #fff,
        0 0 20px #5deaff,
        0 0 50px #008cff;

    pointer-events:none;
    z-index:100;
    transform:translate(-50%,-50%);
}

.cursorRing{
    position:fixed;
    width:45px;
    height:45px;
    border:1px solid rgba(105,231,255,.5);
    border-radius:50%;
    pointer-events:none;
    z-index:99;
    transform:translate(-50%,-50%);
    transition:
        width .25s,
        height .25s,
        border-color .25s;
}

/* -----------------------------
   MOBILE
----------------------------- */

@media(max-width:700px){

    .top{
        top:30px;
    }

    .eyebrow{
        font-size:8px;
    }

    .core{
        transform:
            translate(-50%,-50%)
            scale(.72);
    }

    .hint{
        display:none;
    }

    .bottom{
        bottom:20px;
        font-size:7px;
    }
}
</style>
</head>

<body>

<canvas id="stars"></canvas>
<canvas id="aurora"></canvas>
<canvas id="particles"></canvas>
<canvas id="heartCanvas"></canvas>

<div class="vignette"></div>

<div class="ui">

    <div class="top">
        <div class="eyebrow">AN OCEAN OF EMOTION</div>
        <div class="title">HEART OF BLUE</div>
    </div>

    <div class="core">
        <div class="mainHeart"></div>
    </div>

    <div class="bottom">
        MOVE · FEEL · CLICK
    </div>

    <div class="hint">
        CLICK TO CREATE A WAVE
    </div>

</div>

<div class="cursor"></div>
<div class="cursorRing"></div>


<script>
/* ============================================================
   HEART OF BLUE
   Interactive Canvas Engine
============================================================ */

const starCanvas = document.getElementById("stars");
const auroraCanvas = document.getElementById("aurora");
const particleCanvas = document.getElementById("particles");
const heartCanvas = document.getElementById("heartCanvas");

const star = starCanvas.getContext("2d");
const aurora = auroraCanvas.getContext("2d");
const ctx = particleCanvas.getContext("2d");
const heartCtx = heartCanvas.getContext("2d");

let W = innerWidth;
let H = innerHeight;
let DPR = Math.min(devicePixelRatio,2);

function resizeCanvas(canvas, context){
    canvas.width = W * DPR;
    canvas.height = H * DPR;
    context.setTransform(DPR,0,0,DPR,0,0);
}

function resize(){
    W = innerWidth;
    H = innerHeight;
    DPR = Math.min(devicePixelRatio,2);

    resizeCanvas(starCanvas,star);
    resizeCanvas(auroraCanvas,aurora);
    resizeCanvas(particleCanvas,ctx);
    resizeCanvas(heartCanvas,heartCtx);

    createStars();
    createParticles();
}

addEventListener("resize",resize);


/* ============================================================
   MOUSE PHYSICS
============================================================ */

const mouse = {
    x:W/2,
    y:H/2,
    tx:W/2,
    ty:H/2,
    speed:0
};

addEventListener("mousemove",e=>{

    const dx=e.clientX-mouse.tx;
    const dy=e.clientY-mouse.ty;

    mouse.speed=Math.min(
        Math.sqrt(dx*dx+dy*dy),
        40
    );

    mouse.tx=e.clientX;
    mouse.ty=e.clientY;
});

function updateMouse(){

    mouse.x += (mouse.tx-mouse.x)*.12;
    mouse.y += (mouse.ty-mouse.y)*.12;

    mouse.speed *= .92;
}


/* ============================================================
   STARS
============================================================ */

let stars=[];

function createStars(){

    stars=[];

    const count=Math.min(
        450,
        Math.floor(W*H/3500)
    );

    for(let i=0;i<count;i++){

        stars.push({
            x:Math.random()*W,
            y:Math.random()*H,
            z:Math.random(),
            size:Math.random()*1.5+.2,
            phase:Math.random()*Math.PI*2
        });
    }
}

function drawStars(t){

    star.clearRect(0,0,W,H);

    const gradient=star.createRadialGradient(
        W*.5,H*.5,0,
        W*.5,H*.5,Math.max(W,H)*.7
    );

    gradient.addColorStop(0,"#092c68");
    gradient.addColorStop(.35,"#041a42");
    gradient.addColorStop(1,"#010817");

    star.fillStyle=gradient;
    star.fillRect(0,0,W,H);

    for(const s of stars){

        const alpha=
            .15+
            Math.sin(t*.001+s.phase)*.2+
            s.z*.35;

        star.globalAlpha=Math.max(0,alpha);
        star.fillStyle="#b9f8ff";

        star.beginPath();
        star.arc(
            s.x,
            s.y,
            s.size*s.z,
            0,
            Math.PI*2
        );

        star.fill();
    }

    star.globalAlpha=1;
}


/* ============================================================
   AURORA
============================================================ */

function drawAurora(t){

    aurora.clearRect(0,0,W,H);

    aurora.save();

    aurora.globalCompositeOperation="screen";
    aurora.filter="blur(70px)";

    for(let i=0;i<5;i++){

        const x=
            W*.5+
            Math.sin(t*.00025+i*1.8)*W*.35;

        const y=
            H*.45+
            Math.cos(t*.00018+i)*H*.25;

        const radius=250+i*80;

        const g=aurora.createRadialGradient(
            x,y,0,
            x,y,radius
        );

        g.addColorStop(0,
            i%2
            ? "rgba(0,180,255,.18)"
            : "rgba(100,240,255,.15)"
        );

        g.addColorStop(1,
            "rgba(0,50,255,0)"
        );

        aurora.fillStyle=g;

        aurora.beginPath();
        aurora.arc(x,y,radius,0,Math.PI*2);
        aurora.fill();
    }

    aurora.restore();
}


/* ============================================================
   PARTICLE FIELD
============================================================ */

let particles=[];

class Particle{

    constructor(){

        this.x=Math.random()*W;
        this.y=Math.random()*H;

        this.vx=(Math.random()-.5)*.25;
        this.vy=(Math.random()-.5)*.25;

        this.size=Math.random()*1.8+.3;
        this.alpha=Math.random()*.6+.1;

        this.phase=Math.random()*Math.PI*2;
    }

    update(){

        const dx=mouse.x-this.x;
        const dy=mouse.y-this.y;

        const dist=Math.sqrt(dx*dx+dy*dy);

        if(dist<260){

            const force=
                (1-dist/260)*.035;

            this.vx += dx/dist*force;
            this.vy += dy/dist*force;
        }

        this.vx*=.985;
        this.vy*=.985;

        this.x+=this.vx;
        this.y+=this.vy;

        if(this.x<0)this.x=W;
        if(this.x>W)this.x=0;

        if(this.y<0)this.y=H;
        if(this.y>H)this.y=0;
    }

    draw(t){

        const pulse=
            this.alpha+
            Math.sin(t*.002+this.phase)*.15;

        ctx.globalAlpha=Math.max(0,pulse);

        ctx.fillStyle="#66e9ff";

        ctx.beginPath();
        ctx.arc(
            this.x,
            this.y,
            this.size,
            0,
            Math.PI*2
        );

        ctx.fill();
    }
}

function createParticles(){

    particles=[];

    const count=Math.min(
        900,
        Math.floor(W*H/1200)
    );

    for(let i=0;i<count;i++){
        particles.push(new Particle());
    }
}

function drawParticles(t){

    ctx.clearRect(0,0,W,H);

    for(const p of particles){
        p.update();
        p.draw(t);
    }

    ctx.globalAlpha=1;
}


/* ============================================================
   HEART PARTICLES
============================================================ */

let hearts=[];

const heartColors=[
    "#d9fcff",
    "#91f4ff",
    "#4de4ff",
    "#16bdff",
    "#008cff",
    "#1768ff"
];

function heartShape(c,x,y,size){

    c.save();

    c.translate(x,y);
    c.rotate(-Math.PI/4);

    c.beginPath();

    c.moveTo(0,size*.42);

    c.bezierCurveTo(
        -size*.7,
        -size*.05,
        -size*.45,
        -size*.7,
        0,
        -size*.3
    );

    c.bezierCurveTo(
        size*.45,
        -size*.7,
        size*.7,
        -.05,
        0,
        size*.42
    );

    c.closePath();

    c.restore();
}

class Heart{

    constructor(x,y,burst=false){

        this.x=x;
        this.y=y;

        const a=
            Math.random()*Math.PI*2;

        const power=
            burst
            ? Math.random()*8+2
            : Math.random()*1.5+.2;

        this.vx=Math.cos(a)*power;
        this.vy=Math.sin(a)*power;

        this.size=
            burst
            ? Math.random()*13+5
            : Math.random()*9+3;

        this.life=1;

        this.decay=
            burst
            ? Math.random()*.012+.006
            : Math.random()*.003+.0015;

        this.rotation=Math.random()*Math.PI*2;
        this.spin=(Math.random()-.5)*.04;

        this.color=
            heartColors[
                Math.floor(
                    Math.random()*heartColors.length
                )
            ];

        this.gravity=
            burst
            ? .018
            : -.008;
    }

    update(){

        const dx=mouse.x-this.x;
        const dy=mouse.y-this.y;
        const d=Math.sqrt(dx*dx+dy*dy);

        if(d<170 && d>1){

            const force=(1-d/170)*.22;

            this.vx+=dx/d*force;
            this.vy+=dy/d*force;
        }

        this.x+=this.vx;
        this.y+=this.vy;

        this.vx*=.992;
        this.vy*=.992;

        this.vy+=this.gravity;

        this.rotation+=this.spin;

        this.life-=this.decay;
    }

    draw(){

        heartCtx.save();

        heartCtx.translate(
            this.x,
            this.y
        );

        heartCtx.rotate(this.rotation);

        heartCtx.globalAlpha=
            Math.max(0,this.life);

        heartCtx.shadowBlur=
            this.size*3.5;

        heartCtx.shadowColor=this.color;

        heartCtx.fillStyle=this.color;

        heartShape(
            heartCtx,
            0,
            0,
            this.size
        );

        heartCtx.fill();

        heartCtx.restore();
    }
}

function spawnHeart(){

    hearts.push(
        new Heart(
            Math.random()*W,
            H+20
        )
    );
}

function drawHearts(){

    heartCtx.clearRect(0,0,W,H);

    if(Math.random()<.7){
        spawnHeart();
    }

    for(let i=hearts.length-1;i>=0;i--){

        const h=hearts[i];

        h.update();
        h.draw();

        if(
            h.life<=0 ||
            h.y<-100
        ){
            hearts.splice(i,1);
        }
    }
}


/* ============================================================
   CLICK WAVE
============================================================ */

let waves=[];

addEventListener("click",e=>{

    waves.push({
        x:e.clientX,
        y:e.clientY,
        r:0,
        alpha:1
    });

    for(let i=0;i<55;i++){

        hearts.push(
            new Heart(
                e.clientX,
                e.clientY,
                true
            )
        );
    }
});

function drawWaves(){

    heartCtx.save();

    for(let i=waves.length-1;i>=0;i--){

        const w=waves[i];

        w.r+=9;
        w.alpha*=.955;

        heartCtx.beginPath();

        heartCtx.arc(
            w.x,
            w.y,
            w.r,
            0,
            Math.PI*2
        );

        heartCtx.strokeStyle=
            `rgba(91,230,255,${w.alpha})`;

        heartCtx.lineWidth=2;

        heartCtx.shadowBlur=25;
        heartCtx.shadowColor="#21dfff";

        heartCtx.stroke();

        if(w.alpha<.02){
            waves.splice(i,1);
        }
    }

    heartCtx.restore();
}


/* ============================================================
   MOUSE TRAIL
============================================================ */

let trail=[];

addEventListener("mousemove",e=>{

    trail.push({
        x:e.clientX,
        y:e.clientY,
        life:1,
        size:Math.random()*3+1
    });

    if(trail.length>80){
        trail.shift();
    }
});

function drawTrail(){

    heartCtx.save();

    for(let i=0;i<trail.length;i++){

        const p=trail[i];

        p.life-=.025;

        heartCtx.globalAlpha=
            Math.max(0,p.life)*.65;

        heartCtx.fillStyle="#8ff7ff";

        heartCtx.shadowBlur=20;
        heartCtx.shadowColor="#00bfff";

        heartCtx.beginPath();

        heartCtx.arc(
            p.x,
            p.y,
            p.size*p.life,
            0,
            Math.PI*2
        );

        heartCtx.fill();
    }

    heartCtx.restore();

    trail=trail.filter(p=>p.life>0);
}


/* ============================================================
   CURSOR
============================================================ */

const cursor=document.querySelector(".cursor");
const cursorRing=document.querySelector(".cursorRing");

let ringX=W/2;
let ringY=H/2;

function updateCursor(){

    cursor.style.left=mouse.x+"px";
    cursor.style.top=mouse.y+"px";

    ringX+=(mouse.x-ringX)*.15;
    ringY+=(mouse.y-ringY)*.15;

    cursorRing.style.left=ringX+"px";
    cursorRing.style.top=ringY+"px";

    cursorRing.style.width=
        45+mouse.speed*.5+"px";

    cursorRing.style.height=
        45+mouse.speed*.5+"px";
}


/* ============================================================
   ANIMATION
============================================================ */

function animate(t){

    updateMouse();

    drawStars(t);
    drawAurora(t);
    drawParticles(t);
    drawHearts();
    drawWaves();
    drawTrail();
    updateCursor();

    requestAnimationFrame(animate);
}


/* ============================================================
   START
============================================================ */

resize();

for(let i=0;i<180;i++){

    hearts.push(
        new Heart(
            Math.random()*W,
            Math.random()*H
        )
    );
}

requestAnimationFrame(animate);

</script>

</body>
</html>
