<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>하늘에서 피자가 내려와!</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: linear-gradient(to bottom, #1d2b64, #f8cdda);
      height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Arial', sans-serif;
    }

    h1 {
      color: white;
      text-shadow: 2px 2px 10px rgba(0, 0, 0, 0.5);
      font-size: 3rem;
      z-index: 10;
      pointer-events: none;
    }

    /* 피자 요소 기본 스타일 */
    .pizza {
      position: absolute;
      top: -60px;
      user-select: none;
      pointer-events: none;
      animation: fall linear infinite;
    }

    /* 낙하 및 회전 애니메이션 */
    @keyframes fall {
      0% {
        transform: translateY(0) rotate(0deg);
        opacity: 1;
      }
      100% {
        transform: translateY(105vh) rotate(360deg);
        opacity: 0.7;
      }
    }
  </style>
</head>
<body>

  <h1>🍕 하늘에서 피자가 내려와! 🍕</h1>

  <script>
    function createPizza() {
      const pizza = document.createElement('div');
      pizza.classList.add('pizza');
      pizza.innerText = '🍕';

      // 무작위 속성 설정
      const startLeft = Math.random() * 100; // 좌우 위치 (0vw ~ 100vw)
      const duration = Math.random() * 3 + 2; // 떨어지는 시간 (2초 ~ 5초)
      const size = Math.random() * 30 + 20; // 피자 크기 (20px ~ 50px)

      pizza.style.left = `${startLeft}vw`;
      pizza.style.animationDuration = `${duration}s`;
      pizza.style.fontSize = `${size}px`;

      document.body.appendChild(pizza);

      // 화면 아래로 사라진 후 메모리 정리를 위해 요소 삭제
      setTimeout(() => {
        pizza.remove();
      }, duration * 1000);
    }

    // 150밀리초마다 피자 생성 (숫자를 줄이면 더 많이 떨어짐)
    setInterval(createPizza, 150);
  </script>
</body>
</html>
