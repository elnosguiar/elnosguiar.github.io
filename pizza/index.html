<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>리얼 피자 왁뿌볼 (iOS 타격감 강화판)</title>
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            margin: 0;
            padding: 0;
            background: #2c3e50;
            background: radial-gradient(circle, #34495e 0%, #1a252f 100%);
            height: 100vh;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            touch-action: none;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* iOS 타격감을 위한 화면 흔들림 효과 */
        @keyframes screenShake {
            0% { transform: translate(0, 0) rotate(0deg); }
            20% { transform: translate(-3px, 3px) rotate(-1deg); }
            40% { transform: translate(3px, -3px) rotate(1deg); }
            60% { transform: translate(-3px, -3px) rotate(0deg); }
            80% { transform: translate(3px, 3px) rotate(1deg); }
            100% { transform: translate(0, 0) rotate(0deg); }
        }
        
        body.shake {
            animation: screenShake 0.15s ease-in-out;
        }

        #ui-layer {
            position: absolute;
            top: 10%;
            text-align: center;
            z-index: 10;
            pointer-events: none;
        }

        h1 {
            color: #f39c12;
            margin: 0;
            font-size: 2rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        #score {
            color: #fff;
            font-size: 4rem;
            font-weight: 900;
            margin-top: 10px;
            transition: transform 0.1s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        #game-area {
            position: absolute;
            bottom: 15%;
            width: 100%;
            height: 60%;
            display: flex;
            justify-content: center;
            align-items: flex-end;
        }

        #pizza {
            width: 160px;
            height: 160px;
            background: #e67e22;
            border-radius: 50%;
            position: relative;
            box-shadow: 0 15px 25px rgba(0,0,0,0.5), inset 0 0 15px #d35400;
            cursor: pointer;
            will-change: transform;
        }

        #pizza::before {
            content: '';
            position: absolute;
            top: 12px; left: 12px; right: 12px; bottom: 12px;
            background: #f1c40f;
            border-radius: 50%;
            box-shadow: inset 0 0 10px #e67e22;
        }

        .pepperoni {
            position: absolute;
            width: 28px;
            height: 28px;
            background: #c0392b;
            border-radius: 50%;
            box-shadow: inset 0 0 8px #922b21, 2px 2px 4px rgba(0,0,0,0.2);
            z-index: 2;
        }
        .p1 { top: 30px; left: 65px; }
        .p2 { top: 60px; left: 30px; }
        .p3 { top: 70px; left: 100px; }
        .p4 { top: 105px; left: 60px; }

        .particle {
            position: absolute;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 50%;
            pointer-events: none;
            will-change: transform, opacity;
        }

        .combo-text {
            position: absolute;
            color: #e74c3c;
            font-weight: bold;
            font-size: 1.5rem;
            pointer-events: none;
            animation: floatUp 0.8s ease-out forwards;
            text-shadow: 1px 1px 2px #fff;
        }

        @keyframes floatUp {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(-50px) scale(1.5); opacity: 0; }
        }
    </style>
</head>
<body>

    <div id="ui-layer">
        <h1>🍕 왁뿌볼 콤보!</h1>
        <div id="score">0</div>
    </div>

    <div id="game-area">
        <div id="pizza">
            <div class="pepperoni p1"></div>
            <div class="pepperoni p2"></div>
            <div class="pepperoni p3"></div>
            <div class="pepperoni p4"></div>
        </div>
    </div>

    <script>
        const pizza = document.getElementById('pizza');
        const scoreEl = document.getElementById('score');
        
        let score = 0;
        let velocityY = 0;
        let positionY = 0;
        let rotation = 0;
        let scaleX = 1, scaleY = 1;
        
        const GRAVITY = -0.6;
        const BOUNCE_DAMPING = 0.5;
        let isAirborne = false;

        // --- Web Audio API를 이용한 타격음 생성 (iOS 진동 대체용) ---
        let audioCtx;
        function playThudSound() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            
            // 오실레이터를 이용해 둔탁한 타격음(Thud) 합성
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            osc.type = 'triangle'; // 묵직한 소리
            // 주파수를 빠르게 떨어뜨려 타격감 생성 (150Hz -> 0.01Hz)
            osc.frequency.setValueAtTime(150, audioCtx.currentTime); 
            osc.frequency.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1); 
            
            // 볼륨도 빠르게 줄어들게 설정
            gain.gain.setValueAtTime(1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            
            osc.start();
            osc.stop(audioCtx.currentTime + 0.1);
        }

        // --- iOS용 화면 흔들림 효과 ---
        function triggerScreenShake() {
            document.body.classList.remove('shake');
            // 리플로우 강제 발생 (애니메이션 재시작을 위해)
            void document.body.offsetWidth;
            document.body.classList.add('shake');
        }

        // 물리 엔진 루프
        function gameLoop() {
            if (isAirborne) {
                velocityY += GRAVITY;
                positionY += velocityY;
                rotation += velocityY * 0.8;

                if (positionY <= 0) {
                    positionY = 0;
                    if (Math.abs(velocityY) > 2) {
                        velocityY = -velocityY * BOUNCE_DAMPING;
                        triggerVibration(40); // 안드로이드용 진동
                        triggerScreenShake(); // iOS용 시각적 타격
                        playThudSound();      // 청각적 타격
                    } else {
                        velocityY = 0;
                        isAirborne = false;
                        score = 0;
                        updateScoreDisplay();
                    }
                }
            } else {
                rotation *= 0.95;
            }

            scaleY = 1 + (velocityY * 0.01);
            scaleX = 1 - (velocityY * 0.005);
            scaleY = Math.max(0.8, Math.min(scaleY, 1.2));
            scaleX = Math.max(0.8, Math.min(scaleX, 1.2));

            pizza.style.transform = `translateY(${-positionY}px) rotate(${rotation}deg) scale(${scaleX}, ${scaleY})`;
            requestAnimationFrame(gameLoop);
        }
        
        gameLoop();

        pizza.addEventListener('touchstart', handleTap, { passive: false });
        pizza.addEventListener('mousedown', handleTap);

        function handleTap(e) {
            e.preventDefault();
            
            score++;
            updateScoreDisplay();
            
            velocityY = 16 + (Math.random() * 2);
            isAirborne = true;
            rotation += (Math.random() - 0.5) * 60;

            // 안드로이드: 실제 진동 / iOS: 화면 진동 + 사운드
            triggerVibration([20, 30, 20]);
            triggerScreenShake(); 
            playThudSound();
            
            createFlourParticles(e);
            showComboText(e);
            
            scoreEl.style.transform = 'scale(1.3)';
            setTimeout(() => scoreEl.style.transform = 'scale(1)', 100);
        }

        function updateScoreDisplay() {
            scoreEl.innerText = score;
            if(score === 0) {
                scoreEl.style.color = '#fff';
            } else if (score > 20) {
                scoreEl.style.color = '#e74c3c';
            } else if (score > 10) {
                scoreEl.style.color = '#f1c40f';
            }
        }

        function createFlourParticles(e) {
            const rect = pizza.getBoundingClientRect();
            let touchX = rect.left + rect.width / 2;
            let touchY = rect.top + rect.height / 2;

            if(e.touches && e.touches.length > 0) {
                touchX = e.touches[0].clientX;
                touchY = e.touches[0].clientY;
            }

            for(let i=0; i<8; i++) {
                const particle = document.createElement('div');
                particle.classList.add('particle');
                const size = Math.random() * 6 + 4;
                particle.style.width = `${size}px`;
                particle.style.height = `${size}px`;
                particle.style.left = `${touchX}px`;
                particle.style.top = `${touchY}px`;
                document.body.appendChild(particle);

                let px = (Math.random() - 0.5) * 15;
                let py = (Math.random() - 1) * 15;
                let opacity = 1;

                function animateParticle() {
                    py += 0.5;
                    particle.style.transform = `translate(${px}px, ${py}px)`;
                    opacity -= 0.03;
                    particle.style.opacity = opacity;

                    if (opacity > 0) {
                        requestAnimationFrame(animateParticle);
                    } else {
                        particle.remove();
                    }
                }
                animateParticle();
            }
        }

        function showComboText(e) {
            if (score % 5 !== 0 && score < 10) return;
            const text = document.createElement('div');
            text.classList.add('combo-text');
            const comments = ["Nice!", "Great!", "Perfect!", "Crazy!", "Wow!!"];
            text.innerText = comments[Math.floor(Math.random() * comments.length)];
            const rect = pizza.getBoundingClientRect();
            text.style.left = `${rect.left + 20 + Math.random() * 50}px`;
            text.style.top = `${rect.top}px`;
            document.body.appendChild(text);
            setTimeout(() => text.remove(), 800);
        }

        function triggerVibration(pattern) {
            if ("vibrate" in navigator) {
                navigator.vibrate(pattern);
            }
        }
    </script>
</body>
</html>
