<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Falling Pizzas</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            /* 먹음직스럽고 화창한 하늘 배경 */
            background: linear-gradient(to bottom, #4facfe 0%, #00f2fe 100%);
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, 'Helvetica Neue', 'Segoe UI', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif;
        }
        canvas {
            display: block;
        }
        #ui-layer {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: white;
            pointer-events: none; /* 클릭 이벤트가 캔버스로 통과하도록 설정 */
            text-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        h1 {
            font-size: 3.5rem;
            margin: 0;
            letter-spacing: -1px;
            animation: float 3s ease-in-out infinite;
        }
        p {
            font-size: 1.2rem;
            margin-top: 10px;
            opacity: 0.9;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
    </style>
</head>
<body>

    <!-- UI 오버레이 -->
    <div id="ui-layer">
        <h1>하늘에서 피자가 내려와요! 🍕</h1>
        <p>마우스를 움직여보세요. 화면을 클릭하면 <b>거대한 피자</b>가 떨어집니다!</p>
    </div>

    <!-- Three.js 라이브러리 로드 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        // 1. 씬, 카메라, 렌더러 설정
        const scene = new THREE.Scene();
        // 배경을 투명하게 하여 CSS 그라데이션이 보이게 함
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        // 그림자 활성화
        renderer.shadowMap.enabled = true; 
        document.body.appendChild(renderer.domElement);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 80);

        // 2. 조명 설정 (입체감을 위한 그림자와 하이라이트)
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
        directionalLight.position.set(20, 50, 30);
        directionalLight.castShadow = true;
        scene.add(directionalLight);

        // 3. 3D 피자를 코드로 조형하는 함수
        function createPizza() {
            const pizzaGroup = new THREE.Group();

            // 도우 (Crust)
            const crustGeo = new THREE.CylinderGeometry(5, 5, 0.6, 32);
            const crustMat = new THREE.MeshStandardMaterial({ color: 0xE2903C, roughness: 0.9 });
            const crust = new THREE.Mesh(crustGeo, crustMat);
            crust.castShadow = true;
            pizzaGroup.add(crust);

            // 치즈 (Cheese)
            const cheeseGeo = new THREE.CylinderGeometry(4.6, 4.6, 0.7, 32);
            const cheeseMat = new THREE.MeshStandardMaterial({ color: 0xF5C22D, roughness: 0.4 });
            const cheese = new THREE.Mesh(cheeseGeo, cheeseMat);
            cheese.position.y = 0.05; // 도우 위에 살짝 얹음
            cheese.receiveShadow = true;
            pizzaGroup.add(cheese);

            // 페퍼로니 생성 (랜덤 배치)
            const pepGeo = new THREE.CylinderGeometry(0.9, 0.9, 0.2, 16);
            const pepMat = new THREE.MeshStandardMaterial({ color: 0xC92C23, roughness: 0.7 });
            const numPeps = 6 + Math.floor(Math.random() * 5); // 6~10개
            
            for(let i = 0; i < numPeps; i++) {
                const pep = new THREE.Mesh(pepGeo, pepMat);
                // 반지름 3.5 안에서 랜덤한 x, z 좌표 생성
                const r = 3.5 * Math.sqrt(Math.random());
                const theta = Math.random() * 2 * Math.PI;
                pep.position.set(r * Math.cos(theta), 0.45, r * Math.sin(theta));
                pep.rotation.y = Math.random() * Math.PI;
                pep.castShadow = true;
                pizzaGroup.add(pep);
            }

            // 올리브 생성 (랜덤 배치)
            const oliveGeo = new THREE.TorusGeometry(0.2, 0.08, 8, 16);
            const oliveMat = new THREE.MeshStandardMaterial({ color: 0x2E2E2E, roughness: 0.8 });
            const numOlives = 4 + Math.floor(Math.random() * 4); // 4~7개
            
            for(let i = 0; i < numOlives; i++) {
                const olive = new THREE.Mesh(oliveGeo, oliveMat);
                const r = 3.8 * Math.sqrt(Math.random());
                const theta = Math.random() * 2 * Math.PI;
                olive.position.set(r * Math.cos(theta), 0.45, r * Math.sin(theta));
                olive.rotation.x = Math.PI / 2; // 누워있게 회전
                olive.castShadow = true;
                pizzaGroup.add(olive);
            }

            return pizzaGroup;
        }

        // 4. 피자 배열 생성 및 초기화
        const pizzas = [];
        const numPizzas = 60; // 화면에 내릴 피자의 수

        for (let i = 0; i < numPizzas; i++) {
            const pizza = createPizza();
            
            // 크기 랜덤
            const scale = 0.5 + Math.random() * 0.8;
            pizza.scale.set(scale, scale, scale);
            
            // 초기 위치 랜덤 (하늘 위 넓게 분포)
            resetPizza(pizza, true);
            
            scene.add(pizza);
            pizzas.push(pizza);
        }

        // 피자가 바닥으로 떨어지면 다시 하늘로 올리는 함수
        function resetPizza(pizza, isInitial = false) {
            pizza.position.x = (Math.random() - 0.5) * 120; // 좌우 범위
            // 초기에는 화면 전역에, 리셋될 때는 항상 하늘 위에서
            pizza.position.y = isInitial ? (Math.random() * 100 - 50) : (60 + Math.random() * 40); 
            pizza.position.z = (Math.random() - 0.5) * 60; // 앞뒤 범위

            // 각 피자마다의 떨어지는 속도 및 회전 속도 부여
            pizza.userData = {
                speedY: 0.2 + Math.random() * 0.4,
                rotX: (Math.random() - 0.5) * 0.04,
                rotY: (Math.random() - 0.5) * 0.04,
                rotZ: (Math.random() - 0.5) * 0.04
            };
        }

        // 5. 마우스 인터랙션 설정 (패럴랙스 효과)
        let mouseX = 0;
        let mouseY = 0;
        document.addEventListener('mousemove', (event) => {
            // 화면 중심을 0으로 맞추고 -1 ~ 1 사이의 값으로 정규화
            mouseX = (event.clientX / window.innerWidth) * 2 - 1;
            mouseY = -(event.clientY / window.innerHeight) * 2 + 1;
        });

        // 클릭 시 거대한 피자 소환 이벤트
        document.addEventListener('click', (event) => {
            const giantPizza = createPizza();
            giantPizza.scale.set(3.5, 3.5, 3.5); // 엄청 큰 사이즈
            giantPizza.position.set((Math.random() - 0.5) * 40, 80, (Math.random() - 0.5) * 20);
            
            // 묵직하게 떨어지도록 설정
            giantPizza.userData = {
                speedY: 0.8 + Math.random() * 0.2, 
                rotX: (Math.random() - 0.5) * 0.08,
                rotY: (Math.random() - 0.5) * 0.08,
                rotZ: (Math.random() - 0.5) * 0.08
            };
            
            scene.add(giantPizza);
            pizzas.push(giantPizza);
        });

        // 6. 렌더링 애니메이션 루프
        function animate() {
            requestAnimationFrame(animate);

            // 카메라 움직임 (마우스에 따라 부드럽게 시점 이동)
            camera.position.x += (mouseX * 15 - camera.position.x) * 0.05;
            camera.position.y += (mouseY * 15 + 10 - camera.position.y) * 0.05;
            camera.lookAt(0, 0, 0);

            // 모든 피자 애니메이션 적용
            pizzas.forEach(pizza => {
                // 떨어지기
                pizza.position.y -= pizza.userData.speedY;
                
                // 회전하기
                pizza.rotation.x += pizza.userData.rotX;
                pizza.rotation.y += pizza.userData.rotY;
                pizza.rotation.z += pizza.userData.rotZ;

                // 화면 아래(-60)로 사라지면 다시 위로 리셋
                if (pizza.position.y < -60) {
                    resetPizza(pizza);
                }
            });

            renderer.render(scene, camera);
        }

        // 창 크기 조절 시 대응
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // 애니메이션 시작
        animate();
    </script>
</body>
</html>
