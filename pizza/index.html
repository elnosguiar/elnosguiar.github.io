<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Gargantua: The Pizza Horizon</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-user-select: none; touch-action: none; }
    html, body { width: 100%; height: 100%; background: #000; overflow: hidden; position: fixed; top: 0; left: 0; font-family: sans-serif; }
    #canvas-container { width: 100vw; height: 100vh; height: 100dvh; display: block; }
    #loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #ffaa00; font-size: 1.2rem; font-weight: bold; letter-spacing: 2px; text-shadow: 0 0 10px #ffaa00; z-index: 10; transition: opacity 0.5s; pointer-events: none; }
  </style>
  
  <!-- 최신 Three.js 및 Post-Processing 구동을 위한 Import Map -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.158.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.158.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>

  <div id="loading">COMPUTING GRAVITY...</div>
  <div id="canvas-container"></div>

  <script type="module">
    import * as THREE from 'three';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

    const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry/i.test(navigator.userAgent);
    const PIZZA_COUNT = isMobile ? 80 : 250;

    // ==========================================
    // 1. 최고 품질 절차적 텍스처 (Color, Bump, Roughness)
    // ==========================================
    function createAdvancedPizzaTextures() {
      const size = 1024;
      
      const albedoCanvas = document.createElement('canvas');
      const bumpCanvas = document.createElement('canvas');
      const roughCanvas = document.createElement('canvas');
      albedoCanvas.width = bumpCanvas.width = roughCanvas.width = size;
      albedoCanvas.height = bumpCanvas.height = roughCanvas.height = size;
      
      const ctxA = albedoCanvas.getContext('2d');
      const ctxB = bumpCanvas.getContext('2d');
      const ctxR = roughCanvas.getContext('2d');

      // 베이스 배경
      ctxA.fillStyle = '#f3b033'; ctxA.fillRect(0, 0, size, size); // 치즈
      ctxB.fillStyle = '#888888'; ctxB.fillRect(0, 0, size, size); // 범프 베이스 (평탄)
      ctxR.fillStyle = '#444444'; ctxR.fillRect(0, 0, size, size); // 러프니스 (유광 치즈)

      // 그을린 테두리
      const gradA = ctxA.createRadialGradient(size/2, size, 50, size/2, size, size*0.9);
      gradA.addColorStop(0, 'rgba(255,200,0,0)'); gradA.addColorStop(0.8, '#d47816'); gradA.addColorStop(1, '#5a2200');
      ctxA.fillStyle = gradA; ctxA.fillRect(0, 0, size, size);

      const gradR = ctxR.createRadialGradient(size/2, size, 50, size/2, size, size*0.9);
      gradR.addColorStop(0, 'rgba(0,0,0,0)'); gradR.addColorStop(0.8, '#888888'); gradR.addColorStop(1, '#ffffff'); // 빵끝은 무광
      ctxR.fillStyle = gradR; ctxR.fillRect(0, 0, size, size);

      // 치즈 버블 & 결 (Bump & Color)
      for(let i=0; i<600; i++) {
        const x = Math.random()*size, y = Math.random()*size, r = Math.random()*25+5;
        ctxA.beginPath(); ctxA.arc(x,y,r,0,Math.PI*2);
        ctxA.fillStyle = Math.random()>0.3 ? 'rgba(255,240,180,0.4)' : 'rgba(180,30,0,0.3)';
        ctxA.fill();
        
        ctxB.beginPath(); ctxB.arc(x,y,r,0,Math.PI*2);
        ctxB.fillStyle = `rgb(${128 + Math.random()*60}, ${128 + Math.random()*60}, 128)`;
        ctxB.fill();
      }

      // 3D 입체 페퍼로니
      const peps = [{x:512,y:750,r:100},{x:330,y:480,r:90},{x:700,y:520,r:95},{x:512,y:300,r:85},{x:380,y:200,r:70},{x:650,y:230,r:75}];
      peps.forEach(p => {
        // Albedo (Color)
        const pGrad = ctxA.createRadialGradient(p.x, p.y, 10, p.x, p.y, p.r);
        pGrad.addColorStop(0, '#cc2211'); pGrad.addColorStop(0.8, '#881100'); pGrad.addColorStop(1, '#330500');
        ctxA.beginPath(); ctxA.arc(p.x, p.y, p.r, 0, Math.PI*2); ctxA.fillStyle = pGrad; ctxA.fill();
        
        // Bump (페퍼로니는 치즈 위로 튀어나옴)
        const bGrad = ctxB.createRadialGradient(p.x, p.y, p.r*0.8, p.x, p.y, p.r);
        bGrad.addColorStop(0, '#ffffff'); bGrad.addColorStop(1, '#aaaaaa');
        ctxB.beginPath(); ctxB.arc(p.x, p.y, p.r, 0, Math.PI*2); ctxB.fillStyle = bGrad; ctxB.fill();
        
        // Roughness (기름진 유광)
        ctxR.beginPath(); ctxR.arc(p.x, p.y, p.r, 0, Math.PI*2); ctxR.fillStyle = '#222222'; ctxR.fill();
      });

      return {
        map: new THREE.CanvasTexture(albedoCanvas),
        bumpMap: new THREE.CanvasTexture(bumpCanvas),
        roughnessMap: new THREE.CanvasTexture(roughCanvas)
      };
    }

    // ==========================================
    // 2. 씬, 카메라, 포스트프로세싱 설정
    // ==========================================
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    
    // 심연의 우주 안개
    scene.fog = new THREE.FogExp2(0x05010a, 0.008);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 15, 45);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: "high-performance" });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.2;
    container.appendChild(renderer.domElement);

    // 영화적 느낌을 위한 Unreal Bloom (빛 번짐 효과)
    const renderScene = new RenderPass(scene, camera);
    const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 2.5, 0.6, 0.1);
    
    const composer = new EffectComposer(renderer);
    composer.addPass(renderScene);
    composer.addPass(bloomPass);

    // ==========================================
    // 3. 블랙홀 가르강튀아 (Gargantua) 구축
    // ==========================================
    const blackHoleGroup = new THREE.Group();

    // 빛을 흡수하는 절대 암흑 (Event Horizon)
    const coreGeo = new THREE.SphereGeometry(6, 64, 64);
    const coreMat = new THREE.MeshBasicMaterial({ color: 0x000000 });
    const eventHorizon = new THREE.Mesh(coreGeo, coreMat);
    blackHoleGroup.add(eventHorizon);

    // 강착 디스크 (Accretion Disk) - Bloom 효과와 결합되어 불타오름
    const diskGeo = new THREE.RingGeometry(7, 22, 128);
    const diskCanvas = document.createElement('canvas');
    diskCanvas.width = 1024; diskCanvas.height = 128;
    const dCtx = diskCanvas.getContext('2d');
    const dGrad = dCtx.createLinearGradient(0, 0, 0, 128);
    dGrad.addColorStop(0, 'rgba(0,0,0,0)');
    dGrad.addColorStop(0.1, 'rgba(255, 100, 20, 0.8)');
    dGrad.addColorStop(0.3, 'rgba(255, 230, 180, 1)'); // 초고온 백색/황색
    dGrad.addColorStop(0.6, 'rgba(255, 80, 0, 0.9)');
    dGrad.addColorStop(1, 'rgba(0,0,0,0)');
    dCtx.fillStyle = dGrad; dCtx.fillRect(0, 0, 1024, 128);
    
    const diskMat = new THREE.MeshBasicMaterial({
      map: new THREE.CanvasTexture(diskCanvas),
      side: THREE.DoubleSide,
      transparent: true,
      blending: THREE.AdditiveBlending,
      depthWrite: false
    });
    
    const accretionDisk = new THREE.Mesh(diskGeo, diskMat);
    accretionDisk.rotation.x = Math.PI / 2;
    blackHoleGroup.add(accretionDisk);

    // 중력 렌즈 왜곡링 (아인슈타인 링 - 인터스텔라 시그니처)
    const lensGeo = new THREE.RingGeometry(6.2, 9, 128);
    const lensMat = new THREE.MeshBasicMaterial({
      map: new THREE.CanvasTexture(diskCanvas),
      side: THREE.DoubleSide,
      transparent: true,
      blending: THREE.AdditiveBlending,
      opacity: 0.6,
      depthWrite: false
    });
    const lensRing = new THREE.Mesh(lensGeo, lensMat);
    lensRing.rotation.y = Math.PI / 8; // 살짝 꺾어 입체감 부여
    blackHoleGroup.add(lensRing);

    scene.add(blackHoleGroup);

    // 블랙홀 중심부 강렬한 광원
    const coreLight = new THREE.PointLight(0xffaa55, 800, 150);
    scene.add(coreLight);
    
    const ambientLight = new THREE.AmbientLight(0x221133, 2);
    scene.add(ambientLight);

    // ==========================================
    // 4. 별과 우주 먼지 (입자 시스템)
    // ==========================================
    const starsGeo = new THREE.BufferGeometry();
    const starPos = [];
    for(let i=0; i<3000; i++) {
      const x = (Math.random() - 0.5) * 400;
      const y = (Math.random() - 0.5) * 400;
      const z = (Math.random() - 0.5) * 400;
      // 블랙홀 내부(이벤트 호라이즌)에는 별이 없도록
      if(new THREE.Vector3(x,y,z).length() > 25) {
        starPos.push(x, y, z);
      }
    }
    starsGeo.setAttribute('position', new THREE.Float32BufferAttribute(starPos, 3));
    const starsMat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.5, transparent: true, opacity: 0.8 });
    const starField = new THREE.Points(starsGeo, starsMat);
    scene.add(starField);

    // ==========================================
    // 5. 정교한 피자 지오메트리 & 물리 엔진 배열
    // ==========================================
    const textures = createAdvancedPizzaTextures();
    
    const sliceShape = new THREE.Shape();
    const radius = 3.8, angle = Math.PI/3, hAngle = angle/2;
    sliceShape.moveTo(0,0);
    sliceShape.lineTo(-Math.sin(hAngle)*radius, Math.cos(hAngle)*radius);
    sliceShape.quadraticCurveTo(0, radius*1.05, Math.sin(hAngle)*radius, Math.cos(hAngle)*radius);
    sliceShape.lineTo(0,0);

    const extrudeGeo = new THREE.ExtrudeGeometry(sliceShape, { depth: 0.15, bevelEnabled: true, bevelSize: 0.05, bevelThickness: 0.05 });
    
    // UV 정규화
    extrudeGeo.computeBoundingBox();
    const box = extrudeGeo.boundingBox;
    const uvs = extrudeGeo.attributes.uv;
    for (let i = 0; i < uvs.count; i++) {
      const x = extrudeGeo.attributes.position.getX(i);
      const y = extrudeGeo.attributes.position.getY(i);
      uvs.setXY(i, (x - box.min.x)/(box.max.x - box.min.x), (y - box.min.y)/(box.max.y - box.min.y));
    }

    const pizzaMat = new THREE.MeshStandardMaterial({
      map: textures.map,
      bumpMap: textures.bumpMap,
      bumpScale: 0.05,
      roughnessMap: textures.roughnessMap,
      metalness: 0.1
    });

    const crustMat = new THREE.MeshStandardMaterial({ color: 0xc97a2b, roughness: 0.9 });
    
    const masterPizza = new THREE.Group();
    const sliceMesh = new THREE.Mesh(extrudeGeo, [pizzaMat, crustMat]);
    masterPizza.add(sliceMesh);

    const crustGeo = new THREE.TorusGeometry(Math.sin(hAngle)*radius*1.02, 0.25, 12, 24, angle);
    const crustMesh = new THREE.Mesh(crustGeo, crustMat);
    crustMesh.rotation.x = Math.PI/2;
    crustMesh.rotation.z = Math.PI/2 - hAngle;
    crustMesh.position.set(0, Math.cos(hAngle)*radius - 0.1, 0.07);
    masterPizza.add(crustMesh);
    extrudeGeo.center();
    crustMesh.position.y -= (box.max.y + box.min.y)/2;
    masterPizza.scale.setScalar(0.6);

    // 🍕 피자 객체 및 우주 물리 상태 저장 배열
    const pizzaObjects = [];
    
    for(let i=0; i<PIZZA_COUNT; i++) {
      const p = masterPizza.clone();
      scene.add(p);
      
      // 초기 물리 변수 할당
      const orbitAngle = Math.random() * Math.PI * 2;
      const orbitRadius = 15 + Math.random() * 80; // 블랙홀 주변부터 먼 우주까지
      const yHeight = (Math.random() - 0.5) * 40;
      
      pizzaObjects.push({
        mesh: p,
        angle: orbitAngle,
        radius: orbitRadius,
        y: yHeight,
        spinX: Math.random() * 0.05,
        spinY: Math.random() * 0.05,
        spinZ: Math.random() * 0.05
      });
    }

    // ==========================================
    // 6. 시네마틱 인터렉션 (자이로 & 마우스)
    // ==========================================
    let targetX = 0, targetY = 0;
    const handleMove = (x, y) => {
      targetX = (x / window.innerWidth - 0.5) * 15;
      targetY = (y / window.innerHeight - 0.5) * 15;
    };
    window.addEventListener('mousemove', e => handleMove(e.clientX, e.clientY));
    window.addEventListener('touchmove', e => { if(e.touches.length) handleMove(e.touches[0].clientX, e.touches[0].clientY); }, {passive: true});

    if (window.DeviceOrientationEvent) {
      window.addEventListener('deviceorientation', e => {
        if (e.gamma !== null) {
          targetX = (e.gamma / 45) * 15;
          targetY = ((e.beta - 40) / 45) * 15;
        }
      }, true);
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      composer.setSize(window.innerWidth, window.innerHeight);
    });

    document.getElementById('loading').style.opacity = 0;

    // ==========================================
    // 7. 극한의 물리 엔진 및 렌더 루프
    // ==========================================
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta();
      const time = clock.getElapsedTime();

      // 카메라 유동적 패닝
      camera.position.x += (targetX - camera.position.x) * 0.02;
      camera.position.y += (15 - targetY - camera.position.y) * 0.02;
      camera.lookAt(0, 0, 0);

      // 블랙홀 회전
      accretionDisk.rotation.z -= delta * 0.2;
      lensRing.rotation.z += delta * 0.1;
      starField.rotation.y = time * 0.01;

      // 피자 중력 역학 (Kepler's laws & Spaghettification)
      pizzaObjects.forEach(p => {
        // 중력에 의해 중심으로 빨려 들어감
        p.radius -= delta * (300 / Math.pow(p.radius, 1.5)); 
        
        // 거리가 가까워질수록 공전 속도 폭발적 증가
        const angularVelocity = 10 / Math.pow(p.radius, 1.2);
        p.angle += angularVelocity * delta;
        
        // 강착 디스크(y=0)로 서서히 정렬됨
        p.y *= 0.99; 

        // 3D 공간 좌표 계산
        p.mesh.position.x = Math.cos(p.angle) * p.radius;
        p.mesh.position.z = Math.sin(p.angle) * p.radius;
        p.mesh.position.y = p.y;

        // 자체 회전
        p.mesh.rotation.x += p.spinX;
        p.mesh.rotation.y += p.spinY;
        p.mesh.rotation.z += p.spinZ;

        // **Spaghettification (스파게티화 현상)**
        // 사건의 지평선(r=6)에 접근할수록 엄청난 중력 차이로 인해 물체가 찢어지듯 늘어남
        if (p.radius < 12) {
          const stretch = 1 + (12 - p.radius) * 0.5;
          p.mesh.scale.set(0.6 / stretch, 0.6 / stretch, 0.6 * stretch);
          // 블랙홀의 중심을 향해 방향을 맞춤
          p.mesh.lookAt(0,0,0);
        } else {
          p.mesh.scale.setScalar(0.6);
        }

        // 사건의 지평선(반지름 6)을 넘어가면 우주 멀리서 재설정(Respawn)
        if (p.radius < 5.8) {
          p.radius = 80 + Math.random() * 40;
          p.angle = Math.random() * Math.PI * 2;
          p.y = (Math.random() - 0.5) * 60;
        }
      });

      // Post-Processing Composer로 렌더링 (Bloom 적용)
      composer.render();
    }

    animate();
  </script>
</body>
</html>
