<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Realistic 3D Pizza Rain</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      height: -webkit-fill-available; /* 모바일 주소창 대응 풀스크린 */
      overflow: hidden;
      background: #020008;
      touch-action: none;
      position: fixed; /* 모바일 바운스 스크롤 방지 */
      top: 0;
      left: 0;
    }
    #container {
      width: 100vw;
      height: 100vh;
      height: 100dvh; /* Dynamic Viewport Height */
      display: block;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <div id="container"></div>

  <script>
    const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
    const PIZZA_COUNT = isMobile ? 35 : 70;

    // --- 1. Real Pizza Texture Generator ---
    function generatePizzaTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 1024;
      canvas.height = 1024;
      const ctx = canvas.getContext('2d');

      // 1) 노릇한 치즈 바탕
      const grad = ctx.createRadialGradient(512, 1000, 50, 512, 1000, 950);
      grad.addColorStop(0, '#ffe17d');
      grad.addColorStop(0.5, '#f3b033');
      grad.addColorStop(0.82, '#d47816');
      grad.addColorStop(1, '#7a3300');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 1024, 1024);

      // 2) 토마토 소스 & 치즈 결
      for (let i = 0; i < 400; i++) {
        const x = Math.random() * 1024;
        const y = Math.random() * 1024;
        const r = Math.random() * 30 + 10;
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.fillStyle = Math.random() > 0.4 ? 'rgba(180, 40, 10, 0.25)' : 'rgba(255, 245, 200, 0.4)';
        ctx.fill();
      }

      // 3) 페퍼로니
      const pepperoniPositions = [
        { x: 512, y: 720, r: 95 },
        { x: 360, y: 480, r: 85 },
        { x: 660, y: 500, r: 90 },
        { x: 512, y: 320, r: 80 },
        { x: 390, y: 220, r: 65 },
        { x: 630, y: 240, r: 70 }
      ];

      pepperoniPositions.forEach(p => {
        const pGrad = ctx.createRadialGradient(p.x, p.y, 5, p.x, p.y, p.r);
        pGrad.addColorStop(0, '#a81c07');
        pGrad.addColorStop(0.8, '#780f00');
        pGrad.addColorStop(1, '#4a0800');
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fillStyle = pGrad;
        ctx.fill();

        for (let k = 0; k < 25; k++) {
          const ang = Math.random() * Math.PI * 2;
          const dist = Math.random() * (p.r - 10);
          ctx.beginPath();
          ctx.arc(p.x + Math.cos(ang) * dist, p.y + Math.sin(ang) * dist, Math.random() * 4 + 1, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(255, 220, 200, 0.7)';
          ctx.fill();
        }
      });

      // 4) 올리브
      const olivePositions = [
        { x: 480, y: 530 }, { x: 580, y: 390 }, { x: 310, y: 350 }, { x: 690, y: 350 }
      ];
      olivePositions.forEach(o => {
        ctx.beginPath();
        ctx.arc(o.x, o.y, 26, 0, Math.PI * 2);
        ctx.fillStyle = '#111111';
        ctx.fill();
        ctx.beginPath();
        ctx.arc(o.x, o.y, 11, 0, Math.PI * 2);
        ctx.fillStyle = '#e2a344';
        ctx.fill();
      });

      return new THREE.CanvasTexture(canvas);
    }

    // --- 2. 3D Scene 및 예쁜 은하수/우주 배경 ---
    const container = document.getElementById('container');
    const scene = new THREE.Scene();
    
    // 깊이감 있는 은하수 안개
    scene.fog = new THREE.FogExp2(0x0c061a, 0.02);

    const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 0, 16);

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.2;
    container.appendChild(renderer.domElement);

    // 반짝이는 별 입자(Stars Particle) 배경 추가
    const starGeo = new THREE.BufferGeometry();
    const starCount = isMobile ? 300 : 700;
    const starPos = new Float32Array(starCount * 3);
    for (let i = 0; i < starCount * 3; i += 3) {
      starPos[i] = (Math.random() - 0.5) * 80;
      starPos[i + 1] = (Math.random() - 0.5) * 80;
      starPos[i + 2] = (Math.random() - 0.5) * 50 - 10;
    }
    starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
    const starMat = new THREE.PointsMaterial({
      color: 0xffffff,
      size: 0.15,
      transparent: true,
      opacity: 0.8
    });
    const starField = new THREE.Points(starGeo, starMat);
    scene.add(starField);

    // --- 3. 조명 연출 ---
    const ambientLight = new THREE.AmbientLight(0xffe8d6, 0.8);
    scene.add(ambientLight);

    const mainLight = new THREE.DirectionalLight(0xffffff, 2.0);
    mainLight.position.set(10, 20, 15);
    scene.add(mainLight);

    // 환상적인 보라/분홍 네온 림라이트
    const rimLight1 = new THREE.PointLight(0xff0077, 3, 30);
    rimLight1.position.set(-12, -10, 5);
    scene.add(rimLight1);

    const rimLight2 = new THREE.PointLight(0x00d2ff, 2, 30);
    rimLight2.position.set(12, 10, 5);
    scene.add(rimLight2);

    // --- 4. 정밀 수정된 3D 피자 조각 ---
    const pizzaTexture = generatePizzaTexture();

    function createRealisticPizzaSlice() {
      const group = new THREE.Group();

      const radius = 3.6;        // 피자 반지름
      const angle = Math.PI / 3; // 60도 부채꼴 (1/6 조각)
      const halfAngle = angle / 2;

      // 1) 피자 도우 메인 바디
      const shape = new THREE.Shape();
      shape.moveTo(0, 0);
      shape.lineTo(-Math.sin(halfAngle) * radius, Math.cos(halfAngle) * radius);
      shape.quadraticCurveTo(
        0, radius * 1.05, 
        Math.sin(halfAngle) * radius, Math.cos(halfAngle) * radius
      );
      shape.lineTo(0, 0);

      const extrudeSettings = {
        depth: 0.16,
        bevelEnabled: true,
        bevelSegments: 2,
        steps: 1,
        bevelSize: 0.04,
        bevelThickness: 0.04
      };

      const pizzaGeo = new THREE.ExtrudeGeometry(shape, extrudeSettings);
      
      // UV 정밀 매핑
      pizzaGeo.computeBoundingBox();
      const max = pizzaGeo.boundingBox.max;
      const min = pizzaGeo.boundingBox.min;
      const uvs = pizzaGeo.attributes.uv;
      for (let i = 0; i < uvs.count; i++) {
        const x = pizzaGeo.attributes.position.getX(i);
        const y = pizzaGeo.attributes.position.getY(i);
        uvs.setXY(i, (x - min.x) / (max.x - min.x), (y - min.y) / (max.y - min.y));
      }

      const topMaterial = new THREE.MeshStandardMaterial({
        map: pizzaTexture,
        roughness: 0.35,
        metalness: 0.1,
        bumpMap: pizzaTexture,
        bumpScale: 0.02
      });

      const crustMaterial = new THREE.MeshStandardMaterial({
        color: 0xc97a2b,
        roughness: 0.8,
        metalness: 0.0
      });

      const sliceMesh = new THREE.Mesh(pizzaGeo, [topMaterial, crustMaterial]);
      group.add(sliceMesh);

      // 2) 빵 끝 크러스트 위치 정밀 보정 (도우 곡선에 딱 맞춤)
      const crustGeo = new THREE.TorusGeometry(
        Math.sin(halfAngle) * radius * 1.02, 
        0.22, 
        10, 
        20, 
        angle
      );
      const crustMesh = new THREE.Mesh(crustGeo, crustMaterial);
      
      // 정밀 위치 및 회전 정렬
      crustMesh.rotation.x = Math.PI / 2;
      crustMesh.rotation.z = Math.PI / 2 - halfAngle;
      crustMesh.position.set(0, Math.cos(halfAngle) * radius - 0.1, 0.08);
      group.add(crustMesh);

      // 피자 그룹 중심점 피벗 배치
      pizzaGeo.center();
      // 크러스트 중심점도 피자 전체 중심으로 수동 맞춤
      crustMesh.position.y -= (max.y + min.y) / 2;

      group.scale.setScalar(0.75);
      return group;
    }

    // 피자 개체 배열 생성
    const pizzas = [];
    const masterPizza = createRealisticPizzaSlice();

    for (let i = 0; i < PIZZA_COUNT; i++) {
      const pizza = masterPizza.clone();
      
      const x = (Math.random() - 0.5) * 28;
      const y = (Math.random() - 0.5) * 34;
      const z = (Math.random() - 0.5) * 20 - 2;

      pizza.position.set(x, y, z);
      
      pizzas.push({
        mesh: pizza,
        speedY: Math.random() * 0.07 + 0.03,
        rotSpeedX: (Math.random() - 0.5) * 0.03,
        rotSpeedY: (Math.random() - 0.5) * 0.03,
        rotSpeedZ: (Math.random() - 0.5) * 0.03,
        initialX: x
      });

      scene.add(pizza);
    }

    // --- 5. 인터렉션 및 모바일 리사이즈 대응 ---
    let targetX = 0;
    let targetY = 0;

    function onMove(x, y) {
      targetX = (x / window.innerWidth - 0.5) * 2.5;
      targetY = (y / window.innerHeight - 0.5) * 2.5;
    }

    window.addEventListener('mousemove', (e) => onMove(e.clientX, e.clientY));
    window.addEventListener('touchmove', (e) => {
      if(e.touches.length > 0) onMove(e.touches[0].clientX, e.touches[0].clientY);
    }, { passive: true });

    if (window.DeviceOrientationEvent) {
      window.addEventListener('deviceorientation', (e) => {
        if (e.gamma !== null) {
          targetX = (e.gamma / 40) * 1.5;
          targetY = ((e.beta - 40) / 40) * 1.5;
        }
      }, true);
    }

    function resize() {
      const width = window.innerWidth;
      const height = window.innerHeight;
      camera.aspect = width / height;
      camera.updateProjectionMatrix();
      renderer.setSize(width, height);
    }

    window.addEventListener('resize', resize);
    window.addEventListener('orientationchange', () => setTimeout(resize, 200));

    // --- 6. 애니메이션 루프 ---
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const elapsedTime = clock.getElapsedTime();

      // 카메라 부드러운 움직임
      camera.position.x += (targetX - camera.position.x) * 0.04;
      camera.position.y += (-targetY - camera.position.y) * 0.04;
      camera.lookAt(0, 0, 0);

      // 별 반짝임 회전 효과
      starField.rotation.y = elapsedTime * 0.02;

      // 피자 낙하 및 자이로 회전
      pizzas.forEach(p => {
        p.mesh.position.y -= p.speedY;
        p.mesh.position.x = p.initialX + Math.sin(elapsedTime * 1.5 + p.initialX) * 0.4;

        p.mesh.rotation.x += p.rotSpeedX;
        p.mesh.rotation.y += p.rotSpeedY;
        p.mesh.rotation.z += p.rotSpeedZ;

        if (p.mesh.position.y < -17) {
          p.mesh.position.y = 17;
          p.mesh.position.x = (Math.random() - 0.5) * 28;
          p.initialX = p.mesh.position.x;
        }
      });

      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
