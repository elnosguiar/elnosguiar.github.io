<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>리얼 피자 왁뿌볼</title>
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            margin: 0;
            padding: 0;
            background: #2c3e50;
            background: radial-gradient(circle, #34495e 0%, #1a252f 100%);
            height: 100vh;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            touch-action: none; /* 모바일에서 스크롤 및 당겨서 새로고침 방지 */
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #ui-layer {
            position: absolute;
            top: 10%;
            text-align: center;
            z-index: 10;
            pointer-events: none;
        }

        h1 {
            color: #f39c12;
            margin: 0;
            font-size: 2rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        #score {
            color: #fff;
            font-size: 4rem;
            font-weight: 900;
            margin-top: 10px;
            transition: transform 0.1s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        #game-area {
            position: absolute;
            bottom: 15%;
            width: 100%;
            height: 60%;
            display: flex;
            justify-content: center;
            align-items: flex-end;
        }

        /* 피자 디자인 (CSS만으로 구현) */
        #pizza {
            width: 160px;
            height: 160px;
            background: #e67e22; /* 크러스트 */
            border-radius: 50%;
            position: relative;
            box-shadow: 0 15px 25px rgba(0,0,0,0.5), inset 0 0 15px #d35400;
            cursor: pointer;
            will-change: transform;
        }

        /* 치즈 */
        #pizza::before {
            content: '';
            position: absolute;
            top: 12px; left: 12px; right: 12px; bottom: 12px;
            background: #f1c40f;
            border-radius: 50%;
            box-shadow: inset 0 0 10px #e67e22;
        }

        /* 페퍼로니들 */
        .pepperoni {
            position: absolute;
            width: 28px;
            height: 28px;
            background: #c0392b;
            border-radius: 50%;
            box-shadow: inset 0 0 8px #922b21, 2px 2px 4px rgba(0,0,0,0.2);
            z-index: 2;
        }
        .p1 { top: 30px; left: 65px; }
        .p2 { top: 60px; left: 30px; }
        .p3 { top: 70px; left: 100px; }
        .p4 { top: 105px; left: 60px; }

        /* 밀가루 파티클 */
        .particle {
            position: absolute;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 50%;
            pointer-events: none;
            will-change: transform, opacity;
        }

        /* 콤보 이펙트 텍스트 */
        .combo-text {
            position: absolute;
            color: #e74c3c;
            font-weight: bold;
            font-size: 1.5rem;
            pointer-events: none;
            animation: floatUp 0.8s ease-out forwards;
            text-shadow: 1px 1px 2px #fff;
        }

        @keyframes floatUp {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(-50px) scale(1.5); opacity: 0; }
        }
    </style>
</head>
<body>

    <div id="ui-layer">
        <h1>🍕 왁뿌볼 콤보!</h1>
        <div id="score">0</div>
    </div>

    <div id="game-area">
        <div id="pizza">
            <div class="pepperoni p1"></div>
            <div class="pepperoni p2"></div>
            <div class="pepperoni p3"></div>
            <div class="pepperoni p4"></div>
        </div>
    </div>

    <script>
        const pizza = document.getElementById('pizza');
        const scoreEl = document.getElementById('score');
        
        let score = 0;
        let velocityY = 0;
        let positionY = 0;
        let rotation = 0;
        let scaleX = 1, scaleY = 1;
        
        const GRAVITY = -0.6;
        const BOUNCE_DAMPING = 0.5;
        let isAirborne = false;

        // 물리 엔진 루프
        function gameLoop() {
            if (isAirborne) {
                velocityY += GRAVITY;
                positionY += velocityY;
                rotation += velocityY * 0.8; // 올라가고 내려갈 때 자연스러운 회전

                // 바닥에 닿았을 때
                if (positionY <= 0) {
                    positionY = 0;
                    if (Math.abs(velocityY) > 2) {
                        // 튕김 효과 및 바닥 충돌 진동
                        velocityY = -velocityY * BOUNCE_DAMPING;
                        triggerVibration(40); // 묵직한 진동
                    } else {
                        velocityY = 0;
                        isAirborne = false;
                        score = 0; // 바닥에 떨어지면 점수 초기화
                        updateScoreDisplay();
                    }
                }
            } else {
                // 바닥에 있을 때 서서히 회전 멈춤
                rotation *= 0.95;
            }

            // 스쿼시 & 스트레치 (탄력있는 느낌)
            scaleY = 1 + (velocityY * 0.01);
            scaleX = 1 - (velocityY * 0.005);
            
            // 한계치 설정
            scaleY = Math.max(0.8, Math.min(scaleY, 1.2));
            scaleX = Math.max(0.8, Math.min(scaleX, 1.2));

            pizza.style.transform = `translateY(${-positionY}px) rotate(${rotation}deg) scale(${scaleX}, ${scaleY})`;
            
            requestAnimationFrame(gameLoop);
        }
        
        // 게임 루프 시작
        gameLoop();

        // 터치 및 클릭 이벤트
        pizza.addEventListener('touchstart', handleTap, { passive: false });
        pizza.addEventListener('mousedown', handleTap);

        function handleTap(e) {
            e.preventDefault(); // 더블 탭 줌 방지
            
            score++;
            updateScoreDisplay();
            
            // 공중으로 띄우기 (연타할수록 더 높이!)
            velocityY = 16 + (Math.random() * 2);
            isAirborne = true;
            
            // 타격 방향에 따른 스핀 방향 랜덤화
            rotation += (Math.random() - 0.5) * 60;

            // 리얼한 타격감! 진동 패턴 (안드로이드 지원)
            triggerVibration([20, 30, 20]);
            
            // 시각적 이펙트
            createFlourParticles(e);
            showComboText(e);
            
            // 점수 팝 애니메이션
            scoreEl.style.transform = 'scale(1.3)';
            setTimeout(() => scoreEl.style.transform = 'scale(1)', 100);
        }

        function updateScoreDisplay() {
            scoreEl.innerText = score;
            if(score === 0) {
                scoreEl.style.color = '#fff';
            } else if (score > 20) {
                scoreEl.style.color = '#e74c3c'; // 불타는 피자
            } else if (score > 10) {
                scoreEl.style.color = '#f1c40f'; // 골든 피자
            }
        }

        // 밀가루(파티클) 튀는 효과
        function createFlourParticles(e) {
            const rect = pizza.getBoundingClientRect();
            let touchX = rect.left + rect.width / 2;
            let touchY = rect.top + rect.height / 2;

            // 터치 좌표가 있으면 터치한 곳에서 파티클 생성
            if(e.touches && e.touches.length > 0) {
                touchX = e.touches[0].clientX;
                touchY = e.touches[0].clientY;
            }

            for(let i=0; i<8; i++) {
                const particle = document.createElement('div');
                particle.classList.add('particle');
                
                // 크기 랜덤
                const size = Math.random() * 6 + 4;
                particle.style.width = `${size}px`;
                particle.style.height = `${size}px`;
                
                particle.style.left = `${touchX}px`;
                particle.style.top = `${touchY}px`;
                document.body.appendChild(particle);

                // 파티클 물리
                let px = (Math.random() - 0.5) * 15;
                let py = (Math.random() - 1) * 15;
                let opacity = 1;

                function animateParticle() {
                    py += 0.5; // 파티클 중력
                    particle.style.transform = `translate(${px}px, ${py}px)`;
                    opacity -= 0.03;
                    particle.style.opacity = opacity;

                    if (opacity > 0) {
                        requestAnimationFrame(animateParticle);
                    } else {
                        particle.remove();
                    }
                }
                animateParticle();
            }
        }

        // 콤보 텍스트 이펙트
        function showComboText(e) {
            if (score % 5 !== 0 && score < 10) return; // 5배수이거나 10점 이상일 때만 표시

            const text = document.createElement('div');
            text.classList.add('combo-text');
            
            const comments = ["Nice!", "Great!", "Perfect!", "Crazy!", "Wow!!"];
            text.innerText = comments[Math.floor(Math.random() * comments.length)];
            
            const rect = pizza.getBoundingClientRect();
            text.style.left = `${rect.left + 20 + Math.random() * 50}px`;
            text.style.top = `${rect.top}px`;
            
            document.body.appendChild(text);
            
            setTimeout(() => text.remove(), 800);
        }

        // 진동 헬퍼 함수
        function triggerVibration(pattern) {
            // iOS는 웹 진동 API를 99% 차단하므로 안드로이드 위주로 작동합니다.
            if ("vibrate" in navigator) {
                navigator.vibrate(pattern);
            }
        }
    </script>
</body>
</html>
