<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,
           initial-scale=1,
           maximum-scale=1,
           user-scalable=no,
           viewport-fit=cover"
>

<meta name="theme-color" content="#010713">

<title>∞ BLUE HEART</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-user-select:none;
    user-select:none;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    position:fixed;
    inset:0;

    background:#010713;

    touch-action:none;
    overscroll-behavior:none;
}

body{
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
}

canvas{
    position:fixed;
    inset:0;

    width:100%;
    height:100%;

    display:block;

    touch-action:none;
}

#bg{
    z-index:0;
}

#world{
    z-index:2;
}

#fx{
    z-index:3;
}

.ui{
    position:fixed;
    inset:0;
    z-index:10;

    pointer-events:none;
}

/* ==============================
   LOGO
============================== */

.logo{
    position:absolute;

    top:
        calc(
            env(safe-area-inset-top) + 22px
        );

    left:50%;

    transform:
        translateX(-50%);

    text-align:center;

    white-space:nowrap;
}

.logo small{
    display:block;

    font-size:7px;

    letter-spacing:.5em;

    color:
        rgba(
            180,
            245,
            255,
            .35
        );
}

.logo strong{
    display:block;

    margin-top:5px;

    font-size:18px;

    font-weight:900;

    letter-spacing:-.06em;

    color:#c9fbff;

    text-shadow:
        0 0 10px rgba(80,230,255,.7),
        0 0 30px rgba(0,150,255,.45);
}

/* ==============================
   COUNTER
============================== */

.counter{
    position:absolute;

    top:
        calc(
            env(safe-area-inset-top) + 18px
        );

    right:15px;

    min-width:88px;

    padding:
        7px 11px;

    border-radius:999px;

    border:
        1px solid
        rgba(
            100,
            225,
            255,
            .13
        );

    background:
        rgba(
            1,
            15,
            34,
            .55
        );

    backdrop-filter:
        blur(12px);

    text-align:center;
}

.counter span{
    display:block;

    font-size:6px;

    letter-spacing:.3em;

    color:
        rgba(
            190,
            245,
            255,
            .35
        );
}

#count{
    display:block;

    margin-top:2px;

    font-size:14px;

    font-weight:900;

    color:#aaf8ff;

    text-shadow:
        0 0 12px
        rgba(
            30,
            220,
            255,
            .9
        );
}

/* ==============================
   CENTER
============================== */

.center{
    position:absolute;

    left:50%;
    top:50%;

    width:150px;
    height:150px;

    transform:
        translate(-50%,-50%);
}

.ring{
    position:absolute;
    inset:0;

    border-radius:50%;

    border:
        1px solid
        rgba(
            90,
            225,
            255,
            .08
        );

    animation:
        spin 16s linear infinite;
}

.ring2{
    position:absolute;

    inset:30px;

    border-radius:50%;

    border:
        1px dashed
        rgba(
            100,
            230,
            255,
            .09
        );

    animation:
        spin 10s linear infinite reverse;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

.heart{
    position:absolute;

    left:50%;
    top:50%;

    width:38px;
    height:38px;

    transform:
        translate(-50%,-50%)
        rotate(-45deg);

    background:
        linear-gradient(
            135deg,
            #ffffff,
            #b4faff 25%,
            #20d5ff 62%,
            #006eff
        );

    border-radius:
        7px 0 7px 0;

    filter:
        drop-shadow(
            0 0 9px
            rgba(160,250,255,.9)
        )
        drop-shadow(
            0 0 30px
            rgba(0,180,255,.7)
        );

    animation:
        heartbeat 1.7s
        cubic-bezier(.65,0,.35,1)
        infinite;
}

.heart::before,
.heart::after{
    content:"";

    position:absolute;

    width:38px;
    height:38px;

    background:inherit;

    border-radius:50%;
}

.heart::before{
    left:0;
    top:-19px;
}

.heart::after{
    left:19px;
    top:0;
}

@keyframes heartbeat{

    0%,100%{
        transform:
            translate(-50%,-50%)
            rotate(-45deg)
            scale(.9);
    }

    12%{
        transform:
            translate(-50%,-50%)
            rotate(-45deg)
            scale(1.12);
    }

    22%{
        transform:
            translate(-50%,-50%)
            rotate(-45deg)
            scale(.96);
    }

    32%{
        transform:
            translate(-50%,-50%)
            rotate(-45deg)
            scale(1);
    }
}

/* ==============================
   HINT
============================== */

.hint{
    position:absolute;

    bottom:
        calc(
            env(safe-area-inset-bottom) + 25px
        );

    left:0;

    width:100%;

    text-align:center;

    font-size:7px;

    letter-spacing:.3em;

    color:
        rgba(
            180,
            245,
            255,
            .28
        );

    transition:
        opacity .4s;
}

.hint.hide{
    opacity:0;
}

/* ==============================
   PERFORMANCE
============================== */

.performance{
    position:absolute;

    left:12px;

    top:
        calc(
            env(safe-area-inset-top) + 23px
        );

    font-size:7px;

    letter-spacing:.15em;

    color:
        rgba(
            160,
            240,
            255,
            .25
        );
}

#mode{
    color:
        rgba(
            140,
            240,
            255,
            .5
        );
}

@media(max-width:700px){

    .center{
        transform:
            translate(-50%,-50%)
            scale(.82);
    }

    .performance{
        display:none;
    }
}

@media(max-height:600px){

    .center{
        transform:
            translate(-50%,-50%)
            scale(.62);
    }
}
</style>
</head>

<body>

<canvas id="bg"></canvas>
<canvas id="world"></canvas>
<canvas id="fx"></canvas>

<div class="ui">

    <div class="logo">
        <small>INFINITE EMOTION</small>
        <strong>∞ BLUE HEART</strong>
    </div>

    <div class="counter">
        <span>CREATED</span>
        <b id="count">000000000</b>
    </div>

    <div class="performance">
        <span id="mode">ULTRA</span>
    </div>

    <div class="center">
        <div class="ring"></div>
        <div class="ring2"></div>
        <div class="heart"></div>
    </div>

    <div
        class="hint"
        id="hint"
    >
        TAP · HOLD · DRAG · GO CRAZY
    </div>

</div>


<script>
"use strict";

/* ==========================================================
   ∞ BLUE HEART
   HARDCORE PERFORMANCE EDITION

   중요:

   이 파일은 실행 중에 하트 객체를 생성하지 않는다.

   하트 데이터:
   Float32Array

   파티클 데이터:
   Float32Array

   즉,

       클릭 수 ↑
       메모리 ↑ X

   실제 화면 객체 수는 항상 고정.
========================================================== */


/* ==========================================================
   CANVAS
========================================================== */

const bgCanvas =
    document.getElementById("bg");

const worldCanvas =
    document.getElementById("world");

const fxCanvas =
    document.getElementById("fx");

const bg =
    bgCanvas.getContext(
        "2d",
        {
            alpha:false
        }
    );

const world =
    worldCanvas.getContext(
        "2d",
        {
            alpha:true
        }
    );

const fx =
    fxCanvas.getContext(
        "2d",
        {
            alpha:true
        }
    );

const countText =
    document.getElementById("count");

const hint =
    document.getElementById("hint");

const modeText =
    document.getElementById("mode");


/* ==========================================================
   SIZE
========================================================== */

let W = innerWidth;
let H = innerHeight;

let DPR =
    Math.min(
        window.devicePixelRatio || 1,
        1.35
    );


function setupCanvas(
    c,
    context
){

    c.width =
        Math.max(
            1,
            Math.floor(
                W * DPR
            )
        );

    c.height =
        Math.max(
            1,
            Math.floor(
                H * DPR
            )
        );

    c.style.width =
        W + "px";

    c.style.height =
        H + "px";

    context.setTransform(
        DPR,
        0,
        0,
        DPR,
        0,
        0
    );
}


function resize(){

    W = innerWidth;
    H = innerHeight;

    DPR =
        Math.min(
            window.devicePixelRatio || 1,
            1.35
        );

    setupCanvas(
        bgCanvas,
        bg
    );

    setupCanvas(
        worldCanvas,
        world
    );

    setupCanvas(
        fxCanvas,
        fx
    );

    makeStars();
}


addEventListener(
    "resize",
    resize,
    {
        passive:true
    }
);


/* ==========================================================
   FIXED LIMITS
========================================================== */

/*
   여기서 절대로 배열이 늘어나지 않는다.
*/

const MAX_HEARTS = 500;
const MAX_PARTICLES = 80;


/* ==========================================================
   HEART DATA
========================================================== */

/*
   heartX[i]
   heartY[i]
   ...

   전부 고정 메모리.
*/

const heartX =
    new Float32Array(
        MAX_HEARTS
    );

const heartY =
    new Float32Array(
        MAX_HEARTS
    );

const heartVX =
    new Float32Array(
        MAX_HEARTS
    );

const heartVY =
    new Float32Array(
        MAX_HEARTS
    );

const heartLife =
    new Float32Array(
        MAX_HEARTS
    );

const heartSize =
    new Float32Array(
        MAX_HEARTS
    );

const heartRot =
    new Float32Array(
        MAX_HEARTS
    );

const heartSpin =
    new Float32Array(
        MAX_HEARTS
    );

const heartPhase =
    new Float32Array(
        MAX_HEARTS
    );

const heartColor =
    new Uint8Array(
        MAX_HEARTS
    );


/*
   활성 상태도
   boolean 배열 대신 Uint8Array.
*/

const heartActive =
    new Uint8Array(
        MAX_HEARTS
    );


/*
   원형 큐.

   새로운 하트가 들어오면
   가장 오래된 슬롯을 덮는다.

   절대로 크기가 커지지 않는다.
*/

let heartWrite = 0;

let activeHeartCount = 0;


/* ==========================================================
   PARTICLE DATA
========================================================== */

const partX =
    new Float32Array(
        MAX_PARTICLES
    );

const partY =
    new Float32Array(
        MAX_PARTICLES
    );

const partVX =
    new Float32Array(
        MAX_PARTICLES
    );

const partVY =
    new Float32Array(
        MAX_PARTICLES
    );

const partLife =
    new Float32Array(
        MAX_PARTICLES
    );

const partSize =
    new Float32Array(
        MAX_PARTICLES
    );

const partActive =
    new Uint8Array(
        MAX_PARTICLES
    );

let particleWrite = 0;


/* ==========================================================
   COLORS
========================================================== */

const COLORS = [
    "#efffff",
    "#baf9ff",
    "#77edff",
    "#35dcff",
    "#08c4ff",
    "#008fff",
    "#0065ff"
];


/* ==========================================================
   HEART SPRITES
========================================================== */

/*
   하트를 매 프레임 Path로 만들지 않는다.

   미리 5개 크기 × 7개 색상을 만든다.
*/

const spriteSizes = [
    8,
    11,
    15,
    20,
    27
];

const sprites = [];


function createHeartSprite(
    size,
    color
){

    const s =
        Math.ceil(
            size * 4
        );

    const c =
        document.createElement(
            "canvas"
        );

    c.width = s;
    c.height = s;

    const g =
        c.getContext("2d");

    g.translate(
        s / 2,
        s / 2
    );

    g.rotate(
        -Math.PI / 4
    );

    g.fillStyle = color;

    g.shadowColor = color;
    g.shadowBlur =
        size * .75;

    const r = size;

    g.beginPath();

    g.moveTo(
        0,
        r * .3
    );

    g.bezierCurveTo(
        -r * .75,
        -r * .1,
        -r * .48,
        -r * .7,
        0,
        -r * .32
    );

    g.bezierCurveTo(
        r * .48,
        -r * .7,
        r * .75,
        -r * .1,
        0,
        r * .3
    );

    g.closePath();

    g.fill();

    return c;
}


for(
    let s = 0;
    s < spriteSizes.length;
    s++
){

    sprites[s] = [];

    for(
        let c = 0;
        c < COLORS.length;
        c++
    ){

        sprites[s][c] =
            createHeartSprite(
                spriteSizes[s],
                COLORS[c]
            );
    }
}


/* ==========================================================
   RANDOM
========================================================== */

function random(
    min,
    max
){

    return Math.random() *
        (max - min) +
        min;
}


/* ==========================================================
   SCORE
========================================================== */

let totalCreated = 0;


/*
   매 클릭마다 DOM을 업데이트하면
   오히려 렉이 생긴다.

   화면에는 50ms마다 갱신.
*/

let scoreDirty = false;
let lastScorePaint = 0;


function addScore(
    n
){

    totalCreated += n;

    scoreDirty = true;
}


function paintScore(
    now
){

    if(
        !scoreDirty
    )
        return;

    if(
        now - lastScorePaint <
        50
    )
        return;

    lastScorePaint = now;

    countText.textContent =
        String(
            totalCreated
        ).padStart(
            9,
            "0"
        );

    scoreDirty = false;
}


/* ==========================================================
   HEART SPAWN
========================================================== */

function spawnHeart(
    x,
    y,
    power
){

    /*
       현재 슬롯.

       기존 하트가 살아 있어도
       그냥 덮어쓴다.

       이게 핵심이다.
    */

    const i =
        heartWrite;

    heartWrite++;

    if(
        heartWrite >= MAX_HEARTS
    ){

        heartWrite = 0;
    }


    heartActive[i] = 1;


    heartX[i] = x;
    heartY[i] = y;


    const angle =
        Math.random() *
        Math.PI * 2;


    const speed =
        random(
            .35,
            2.8
        ) *
        power;


    heartVX[i] =
        Math.cos(angle) *
        speed;


    heartVY[i] =
        Math.sin(angle) *
        speed;


    heartSize[i] =
        random(
            5,
            17
        );


    heartLife[i] = 1;


    heartRot[i] =
        random(
            0,
            Math.PI * 2
        );


    heartSpin[i] =
        random(
            -.025,
            .025
        );


    heartPhase[i] =
        random(
            0,
            Math.PI * 2
        );


    heartColor[i] =
        (
            Math.random() *
            COLORS.length
        ) | 0;
}


/* ==========================================================
   BURST
========================================================== */

/*
   아무리 미친 듯이 클릭해도
   한 번의 입력이 만드는 실제 하트 수는 제한.

   그래서 이벤트 폭주로 브라우저가 죽지 않는다.
*/

function burst(
    x,
    y,
    amount,
    power
){

    const MAX_PER_EVENT = 32;

    if(
        amount >
        MAX_PER_EVENT
    ){

        amount =
            MAX_PER_EVENT;
    }


    for(
        let i = 0;
        i < amount;
        i++
    ){

        spawnHeart(
            x + random(-8,8),
            y + random(-8,8),
            power
        );
    }


    addScore(
        amount
    );
}


/* ==========================================================
   PARTICLE
========================================================== */

function spawnParticle(
    x,
    y,
    power
){

    const i =
        particleWrite;

    particleWrite++;

    if(
        particleWrite >=
        MAX_PARTICLES
    ){

        particleWrite = 0;
    }


    partActive[i] = 1;

    partX[i] = x;
    partY[i] = y;


    const angle =
        Math.random() *
        Math.PI * 2;


    const speed =
        random(
            1,
            6
        ) *
        power;


    partVX[i] =
        Math.cos(angle) *
        speed;


    partVY[i] =
        Math.sin(angle) *
        speed;


    partLife[i] = 1;

    partSize[i] =
        random(
            .6,
            2
        );
}


/* ==========================================================
   STARS
========================================================== */

let starsX;
let starsY;
let starsR;
let starsA;
let starCount = 0;


function makeStars(){

    starCount =
        Math.min(
            150,
            Math.floor(
                W * H / 5000
            )
        );


    starsX =
        new Float32Array(
            starCount
        );

    starsY =
        new Float32Array(
            starCount
        );

    starsR =
        new Float32Array(
            starCount
        );

    starsA =
        new Float32Array(
            starCount
        );


    for(
        let i = 0;
        i < starCount;
        i++
    ){

        starsX[i] =
            random(
                0,
                W
            );

        starsY[i] =
            random(
                0,
                H
            );

        starsR[i] =
            random(
                .2,
                1.1
            );

        starsA[i] =
            random(
                .1,
                .55
            );
    }
}


/* ==========================================================
   BACKGROUND
========================================================== */

function drawBackground(
    now
){

    const gradient =
        bg.createRadialGradient(
            W * .5,
            H * .45,
            0,
            W * .5,
            H * .5,
            Math.max(W,H) * .8
        );


    gradient.addColorStop(
        0,
        "#092e69"
    );

    gradient.addColorStop(
        .4,
        "#041b43"
    );

    gradient.addColorStop(
        1,
        "#010611"
    );


    bg.fillStyle =
        gradient;

    bg.fillRect(
        0,
        0,
        W,
        H
    );


    bg.fillStyle =
        "#b9f7ff";


    for(
        let i = 0;
        i < starCount;
        i++
    ){

        bg.globalAlpha =
            starsA[i] +
            Math.sin(
                now * .001 +
                i
            ) * .1;

        bg.beginPath();

        bg.arc(
            starsX[i],
            starsY[i],
            starsR[i],
            0,
            Math.PI * 2
        );

        bg.fill();
    }


    bg.globalAlpha = 1;
}


/* ==========================================================
   INPUT
========================================================== */

let pointerX = 0;
let pointerY = 0;

let pointerDown = false;

let pointerStart = 0;

let lastPointerX = 0;
let lastPointerY = 0;

let moveAccumulator = 0;


/*
   pointermove는 브라우저가 엄청나게 많이 보낼 수 있다.

   따라서 위치만 저장하고
   실제 생성은 animation frame에서 한다.
*/

let inputDirty = false;


function pointerDownHandler(
    e
){

    e.preventDefault();

    pointerDown = true;

    pointerX = e.clientX;
    pointerY = e.clientY;

    lastPointerX = pointerX;
    lastPointerY = pointerY;

    pointerStart =
        performance.now();

    inputDirty = true;

    hint.classList.add(
        "hide"
    );


    burst(
        pointerX,
        pointerY,
        10,
        1.2
    );


    for(
        let i = 0;
        i < 6;
        i++
    ){

        spawnParticle(
            pointerX,
            pointerY,
            .5
        );
    }


    vibrate(6);
}


function pointerMoveHandler(
    e
){

    e.preventDefault();

    pointerX =
        e.clientX;

    pointerY =
        e.clientY;

    inputDirty = true;
}


function pointerUpHandler(
    e
){

    e.preventDefault();

    pointerX =
        e.clientX;

    pointerY =
        e.clientY;


    const hold =
        performance.now() -
        pointerStart;


    pointerDown = false;


    if(
        hold < 280
    ){

        burst(
            pointerX,
            pointerY,
            22,
            1.5
        );


        for(
            let i = 0;
            i < 10;
            i++
        ){

            spawnParticle(
                pointerX,
                pointerY,
                .8
            );
        }


        vibrate(10);
    }
    else{

        /*
           오래 누른 경우에도
           실제 생성량은 제한.
        */

        const power =
            Math.min(
                4,
                1 +
                hold / 1000
            );


        burst(
            pointerX,
            pointerY,
            32,
            power
        );


        for(
            let i = 0;
            i < 20;
            i++
        ){

            spawnParticle(
                pointerX,
                pointerY,
                power * .3
            );
        }


        vibrate(20);
    }
}


addEventListener(
    "pointerdown",
    pointerDownHandler,
    {
        passive:false
    }
);

addEventListener(
    "pointermove",
    pointerMoveHandler,
    {
        passive:false
    }
);

addEventListener(
    "pointerup",
    pointerUpHandler,
    {
        passive:false
    }
);

addEventListener(
    "pointercancel",
    ()=>{
        pointerDown = false;
    },
    {
        passive:true
    }
);


/* ==========================================================
   DRAG GENERATOR
========================================================== */

/*
   핵심 최적화:

   pointermove 이벤트마다 생성하지 않는다.

   requestAnimationFrame 당
   최대 4개만 생성.

   따라서 손가락을 미친 듯이 흔들어도
   이벤트 폭주가 렌더 폭주로 이어지지 않는다.
*/

function processInput(){

    if(
        !pointerDown ||
        !inputDirty
    )
        return;


    const dx =
        pointerX -
        lastPointerX;

    const dy =
        pointerY -
        lastPointerY;


    const distance =
        Math.sqrt(
            dx * dx +
            dy * dy
        );


    lastPointerX =
        pointerX;

    lastPointerY =
        pointerY;

    inputDirty = false;


    moveAccumulator +=
        distance;


    /*
       한 프레임 최대 4개.

       절대로 이벤트 횟수만큼
       생성하지 않는다.
    */

    let amount = 0;


    if(
        moveAccumulator >= 5
    ){

        amount =
            Math.min(
                4,
                Math.floor(
                    moveAccumulator / 5
                )
            );

        moveAccumulator -=
            amount * 5;
    }


    for(
        let i = 0;
        i < amount;
        i++
    ){

        spawnHeart(
            pointerX +
            random(-4,4),

            pointerY +
            random(-4,4),

            .75
        );
    }


    addScore(
        amount
    );
}


/* ==========================================================
   HEART UPDATE + DRAW
========================================================== */

function updateHearts(){

    /*
       pointer influence.

       pointer가 없으면
       거리 계산조차 하지 않는다.
    */

    const attract =
        pointerDown;


    for(
        let i = 0;
        i < MAX_HEARTS;
        i++
    ){

        if(
            heartActive[i] === 0
        )
            continue;


        let x =
            heartX[i];

        let y =
            heartY[i];

        let vx =
            heartVX[i];

        let vy =
            heartVY[i];


        /*
           손가락 주변에서 살짝 끌려오는 효과.
        */

        if(attract){

            const dx =
                pointerX - x;

            const dy =
                pointerY - y;

            const d2 =
                dx * dx +
                dy * dy;


            if(
                d2 <
                180 * 180 &&
                d2 >
                4
            ){

                /*
                   sqrt는 여기서만.

                   모든 하트에 대해
                   항상 계산하지 않는다.
                */

                const d =
                    Math.sqrt(d2);

                const force =
                    (
                        1 -
                        d / 180
                    ) * .025;


                vx +=
                    dx / d *
                    force;

                vy +=
                    dy / d *
                    force;
            }
        }


        x += vx;
        y += vy;


        vx *= .988;
        vy *= .988;


        /*
           아주 약한 부유 효과.
        */

        vy +=
            Math.sin(
                i * .7 +
                performance.now() * .0007
            ) * .002;


        heartRot[i] +=
            heartSpin[i];

        heartPhase[i] +=
            .025;


        heartLife[i] -=
            .0017;


        /*
           화면 밖으로 완전히 나가면
           반대편에서 등장.

           죽여서 다시 만드는 게 아니라
           그대로 순환.
        */

        if(
            x < -40
        )
            x = W + 40;

        else if(
            x > W + 40
        )
            x = -40;


        if(
            y < -40
        )
            y = H + 40;

        else if(
            y > H + 40
        )
            y = -40;


        /*
           수명이 끝나도
           객체를 삭제하지 않는다.

           그냥 초기화해서 재사용.
        */

        if(
            heartLife[i] <= 0
        ){

            x =
                random(
                    0,
                    W
                );

            y =
                random(
                    0,
                    H
                );

            vx =
                random(
                    -.7,
                    .7
                );

            vy =
                random(
                    -.7,
                    .7
                );

            heartLife[i] = 1;
        }


        heartX[i] = x;
        heartY[i] = y;

        heartVX[i] = vx;
        heartVY[i] = vy;
    }
}


function drawHearts(){

    world.clearRect(
        0,
        0,
        W,
        H
    );


    for(
        let i = 0;
        i < MAX_HEARTS;
        i++
    ){

        if(
            heartActive[i] === 0
        )
            continue;


        /*
           size를 매번 계산하되
           객체 생성 없음.
        */

        const s =
            heartSize[i];


        let spriteIndex;


        if(
            s < 9
        )
            spriteIndex = 0;

        else if(
            s < 12
        )
            spriteIndex = 1;

        else if(
            s < 17
        )
            spriteIndex = 2;

        else if(
            s < 23
        )
            spriteIndex = 3;

        else
            spriteIndex = 4;


        const sprite =
            sprites[
                spriteIndex
            ][
                heartColor[i]
            ];


        const drawSize =
            spriteSizes[
                spriteIndex
            ] * 4;


        world.globalAlpha =
            Math.max(
                .08,
                heartLife[i]
            );


        world.drawImage(
            sprite,

            heartX[i] -
            drawSize / 2,

            heartY[i] -
            drawSize / 2,

            drawSize,
            drawSize
        );
    }


    world.globalAlpha = 1;
}


/* ==========================================================
   PARTICLE UPDATE + DRAW
========================================================== */

function updateParticles(){

    fx.clearRect(
        0,
        0,
        W,
        H
    );


    for(
        let i = 0;
        i < MAX_PARTICLES;
        i++
    ){

        if(
            partActive[i] === 0
        )
            continue;


        partX[i] +=
            partVX[i];

        partY[i] +=
            partVY[i];


        partVX[i] *=
            .94;

        partVY[i] *=
            .94;


        partLife[i] -=
            .045;


        if(
            partLife[i] <= 0
        ){

            partActive[i] = 0;

            continue;
        }


        fx.globalAlpha =
            partLife[i];


        fx.fillStyle =
            "#9ff7ff";


        fx.beginPath();

        fx.arc(
            partX[i],
            partY[i],
            partSize[i],
            0,
            Math.PI * 2
        );

        fx.fill();
    }


    fx.globalAlpha = 1;
}


/* ==========================================================
   PERFORMANCE MONITOR
========================================================== */

let frameCount = 0;
let fpsStart =
    performance.now();

let qualityLevel = 2;


/*
   2 = ULTRA
   1 = HIGH
   0 = SAFE
*/

function monitorFPS(
    now
){

    frameCount++;


    if(
        now - fpsStart <
        1800
    )
        return;


    const fps =
        frameCount /
        (
            (now - fpsStart) /
            1000
        );


    if(
        fps < 38
    ){

        qualityLevel =
            Math.max(
                0,
                qualityLevel - 1
            );
    }
    else if(
        fps > 57
    ){

        qualityLevel =
            Math.min(
                2,
                qualityLevel + 1
            );
    }


    if(
        qualityLevel === 2
    ){

        modeText.textContent =
            "ULTRA";
    }
    else if(
        qualityLevel === 1
    ){

        modeText.textContent =
            "HIGH";
    }
    else{

        modeText.textContent =
            "SAFE";
    }


    /*
       SAFE에서는
       실제로 살아 있는 슬롯 수를 줄인다.

       데이터는 그대로 있지만
       렌더/업데이트 비용 감소.
    */

    frameCount = 0;

    fpsStart = now;
}


/* ==========================================================
   SAFE ACTIVE LIMIT
========================================================== */

function currentHeartLimit(){

    if(
        qualityLevel === 2
    )
        return MAX_HEARTS;

    if(
        qualityLevel === 1
    )
        return 350;

    return 220;
}


/* ==========================================================
   VISIBILITY
========================================================== */

let sleeping = false;


document.addEventListener(
    "visibilitychange",
    ()=>{
        sleeping =
            document.hidden;

        /*
           복귀했을 때
           입력 누적량 초기화.
        */

        if(
            sleeping
        ){

            pointerDown = false;

            inputDirty = false;

            moveAccumulator = 0;
        }
    }
);


/* ==========================================================
   VIBRATION
========================================================== */

function vibrate(
    ms
){

    if(
        navigator.vibrate
    ){

        navigator.vibrate(
            ms
        );
    }
}


/* ==========================================================
   MAIN LOOP
========================================================== */

let lastTime =
    performance.now();


function frame(
    now
){

    if(
        sleeping
    ){

        requestAnimationFrame(
            frame
        );

        return;
    }


    /*
       브라우저가 탭 전환 후
       10초 동안 멈췄다가 돌아오는 경우.

       절대로 10초치 물리 계산을
       한꺼번에 하지 않는다.
    */

    let delta =
        now -
        lastTime;


    if(
        delta > 50
    ){

        delta = 50;
    }


    lastTime = now;


    processInput();


    /*
       실제 업데이트 대상 수.

       SAFE 모드에서 자동 감소.
    */

    const limit =
        currentHeartLimit();


    /*
       MAX_HEARTS까지 돌 필요 없음.
    */

    for(
        let i = 0;
        i < limit;
        i++
    ){

        if(
            heartActive[i] === 0
        )
            continue;


        let x =
            heartX[i];

        let y =
            heartY[i];

        let vx =
            heartVX[i];

        let vy =
            heartVY[i];


        /*
           드래그 중일 때만
           마우스/손가락 영향 계산.
        */

        if(pointerDown){

            const dx =
                pointerX - x;

            const dy =
                pointerY - y;

            const d2 =
                dx * dx +
                dy * dy;


            if(
                d2 <
                32400 &&
                d2 >
                4
            ){

                const d =
                    Math.sqrt(d2);

                const f =
                    (
                        1 -
                        d / 180
                    ) * .025;


                vx +=
                    dx / d *
                    f;

                vy +=
                    dy / d *
                    f;
            }
        }


        x += vx;
        y += vy;


        vx *= .988;
        vy *= .988;


        heartRot[i] +=
            heartSpin[i];

        heartPhase[i] +=
            .025;


        heartLife[i] -=
            .0017;


        if(
            x < -40
        )
            x = W + 40;

        else if(
            x > W + 40
        )
            x = -40;


        if(
            y < -40
        )
            y = H + 40;

        else if(
            y > H + 40
        )
            y = -40;


        if(
            heartLife[i] <= 0
        ){

            x =
                random(
                    0,
                    W
                );

            y =
                random(
                    0,
                    H
                );

            vx =
                random(
                    -.7,
                    .7
                );

            vy =
                random(
                    -.7,
                    .7
                );

            heartLife[i] = 1;
        }


        heartX[i] = x;
        heartY[i] = y;

        heartVX[i] = vx;
        heartVY[i] = vy;
    }


    /*
       나머지 슬롯은
       그냥 렌더에서 무시.
    */


    drawBackground(
        now
    );


    /*
       현재 활성 수가 아닌
       슬롯도 실제로는 그리지 않는다.
    */

    world.clearRect(
        0,
        0,
        W,
        H
    );


    for(
        let i = 0;
        i < limit;
        i++
    ){

        if(
            heartActive[i] === 0
        )
            continue;


        const s =
            heartSize[i];


        let si;


        if(
            s < 9
        )
            si = 0;

        else if(
            s < 12
        )
            si = 1;

        else if(
            s < 17
        )
            si = 2;

        else if(
            s < 23
        )
            si = 3;

        else
            si = 4;


        const image =
            sprites[si][
                heartColor[i]
            ];


        const ds =
            spriteSizes[si] * 4;


        world.globalAlpha =
            Math.max(
                .08,
                heartLife[i]
            );


        world.drawImage(
            image,

            heartX[i] -
            ds / 2,

            heartY[i] -
            ds / 2,

            ds,
            ds
        );
    }


    world.globalAlpha = 1;


    /*
       Particle update.
    */

    updateParticles();


    /*
       점수 DOM 업데이트도 제한.
    */

    paintScore(
        now
    );


    monitorFPS(
        now
    );


    requestAnimationFrame(
        frame
    );
}


/* ==========================================================
   INITIALIZE
========================================================== */

resize();


/*
   시작 화면.

   이것도 객체 생성이 아니라
   고정 슬롯에 직접 넣는다.
*/

for(
    let i = 0;
    i < 100;
    i++
){

    spawnHeart(
        random(0,W),
        random(0,H),
        .7
    );
}


/*
   루프 시작.
*/

requestAnimationFrame(
    frame
);


/* ==========================================================
   BROWSER CONTROL
========================================================== */

    "contextmenu",
    e=>{
        e.preventDefault();
    }
);

document.addEventListener(
    "selectstart",
    e=>{
        e.preventDefault();
    }

    }

        passive:false
    }

/* ==========================================================
   DOUBLE TAP / DOUBLE CLICK
========================================================== */

let lastTap = 0;


addEventListener(
    "pointerup",
    e=>{

        const now =
            performance.now();


        if(
            now - lastTap <
            280
        ){

            /*
               더블 탭이어도
               최대 32개만 실제 생성.
            */

            burst(
                e.clientX,
                e.clientY,
                32,
                3
            );


            for(
                let i = 0;
                i < 20;
                i++
            ){

                spawnParticle(
                    e.clientX,
                    e.clientY,
                    1
                );
            }


            vibrate(25);
        }


        lastTap = now;
    },
    {
        passive:false
    }
);


/* ==========================================================
   SCREEN WAKE
========================================================== */

let wakeLock = null;


async function requestWakeLock(){

    try{

        if(
            "wakeLock" in navigator
        ){

            wakeLock =
                await navigator
                    .wakeLock
                    .request(
                        "screen"
                    );
        }

    }catch(_){}
}


requestWakeLock();


document.addEventListener(
    "visibilitychange",
    ()=>{

        if(
            !document.hidden
        ){

            requestWakeLock();
        }
    }
);

</script>
